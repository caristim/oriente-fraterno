  <script>
    // ── FIX 1: registrarTokenFCM siempre escribe en Firestore ────────────────
    // Antes solo escribía si el token había cambiado respecto a localStorage.
    // Problema: si el workflow borraba el token de Firestore por inválido,
    // localStorage aún lo tenía → la función no lo re-escribía → el usuario
    // quedaba sin token y no recibía más notificaciones hasta que borrara caché.
    // Ahora siempre hace set() (es idempotente y cuesta nada).
    async function registrarTokenFCM() {
      try {
        if (!('serviceWorker' in navigator) || !('Notification' in window) || !db) return;
        const messaging = firebase.messaging();
        const token = await messaging.getToken({
          vapidKey: 'BM1SqlyjKhW45Y2JSBqDTYRT5QBV0yduJBtonc_QrlqM1DgaDmanz_w1R0Qj40ZuiG-rz4s4stIqBuYmciutG9Y',
          serviceWorkerRegistration: await navigator.serviceWorker.ready
        });
        if (token) {
          const prevToken = localStorage.getItem('fcm_token');
          // Borrar token anterior de Firestore si cambió
          if (prevToken && prevToken !== token) {
            try { await db.collection('fcm_tokens').doc(prevToken).delete(); } catch(_) {}
          }
          // FIX: siempre escribir en Firestore, no solo cuando el token cambia.
          // Esto recupera tokens que fueron borrados de Firestore por ser "inválidos"
          // pero que FCM regeneró con el mismo valor.
          await db.collection('fcm_tokens').doc(token).set({
            token: token,
            updatedAt: new Date().toISOString()
          });
          localStorage.setItem('fcm_token', token);
          console.log('[FCM] Token registrado en Firestore:', token.substring(0, 20) + '...');
        }
      } catch(err) {
        console.warn('[FCM] Error registrando token:', err.message);
      }
    }
    window._registrarTokenFCM = registrarTokenFCM;
    async function scheduleNotification(ev) {}
  </script>

    const STORAGE_KEY = 'orienteFraterno_v2';

    // ── Detección de plataforma ───────────────────────────────────────────────
    function detectPlatform() {
      const ua = navigator.userAgent || '';
      const isIOS     = /iPhone|iPad|iPod/i.test(ua);

    const TIPOS = [
      { value: 'Cumpleaños',               label: 'Cumpleaños',               emoji: '🎂' },
      { value: 'Fecha de casamiento',       label: 'Fecha de casamiento',       emoji: '💍' },
      { value: 'Aniversario',               label: 'Aniversario',               emoji: '🌹' },

    const TIPO_STYLES = {
      'Cumpleaños':               'bg-amber-900/20  border-amber-600/30',
      'Fecha de casamiento':      'bg-purple-900/20 border-purple-500/30',
      'Aniversario':              'bg-rose-900/20   border-rose-600/30',
      'Pasaje al Oriente Eterno': 'bg-slate-800/50  border-slate-500/30',
    };

    // Helpers robustos
    function loadEvents() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) return [];
        const parsed = JSON.parse(data);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Error cargando localStorage:", e);
        return [];
      }
    }

    function saveEvents(l) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); } catch(e) {}
    }

    async function saveEventToFirebase(ev) {
      if (!db) return;
      try { await db.collection('eventos').doc(String(ev.id)).set(ev); } catch(e) { console.warn(e); }
    }

    async function deleteEventFromFirebase(ev) {
      if (!db) return;
      try {
        const docId = ev.docId || String(ev.id);
        await db.collection('eventos').doc(docId).delete();
      } catch(e) { console.warn(e); }
    }

    function formatDate(iso) {
      if (!iso || typeof iso !== 'string') return '';
      const parts = iso.split('-');
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      if (parts.length === 2) {
        const mIdx = parseInt(parts[0]) - 1;
        return `${parts[1]} ${months[mIdx] || ''}`;
      }
      if (parts.length === 3) {
        const mIdx = parseInt(parts[1]) - 1;
        return `${parts[2]} ${months[mIdx] || ''}`;
      }
      return iso;
    }

    function daysUntil(iso) {
      if (!iso || typeof iso !== 'string') return 999;
      try {
        const today = new Date(); today.setHours(0,0,0,0);
        const parts = iso.split('-');
        let m, d;
        if (parts.length === 2) { [m, d] = parts; }
        else if (parts.length === 3) { [, m, d] = parts; }
        else return 999;
        
        let next = new Date(today.getFullYear(), parseInt(m) - 1, parseInt(d));
        if (isNaN(next.getTime())) return 999;
        if (next < today) next.setFullYear(next.getFullYear() + 1);
        return Math.round((next - today) / 86400000);
      } catch (e) {
        return 999;
      }
    }

    // Service Worker
    let swRegistration = null;
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        swRegistration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
        return swRegistration;
      } catch (err) {
        console.warn('[SW] Error:', err);
        return null;
      }
    }

    async function syncEventsToSW(events) {
      try {
        const reg = swRegistration || await registerServiceWorker();
        if (!reg || !reg.active) return;
        reg.active.postMessage({ type: 'SCHEDULE_EVENTS', events });
      } catch (err) {}
    }

    // ── FIX 2: registrar Background Periodic Sync ────────────────────────────
    // Antes nunca se llamaba a reg.periodicSync.register(), por lo que el
    // listener 'periodicsync' del SW nunca se activaba en Android Chrome.
    async function registrarPeriodicSync(reg) {
      if (!reg || !('periodicSync' in reg)) return;
      try {
        const tags = await reg.periodicSync.getTags();
        if (!tags.includes('of-daily-check')) {
          await reg.periodicSync.register('of-daily-check', {
            minInterval: 20 * 60 * 60 * 1000  // 20 horas (margen ante el delay de Chrome)
          });
          console.log('[SW] Periodic sync registrado');
        }
      } catch (e) {
        // periodicSync puede requerir "frecuent usage" en Chrome; no es fatal
        console.warn('[SW] Periodic sync no disponible:', e.message);
      }
    }

    function Icon({ name, size = 18, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconType = lucide[name] || lucide['HelpCircle'];
          if (iconType) {
            const icon = lucide.createElement(iconType);
            icon.setAttribute('width', size);
            icon.setAttribute('height', size);
            if (className) icon.setAttribute('class', className);
            ref.current.appendChild(icon);
          }
        }
      }, [name, size, className]);
      return <span ref={ref} style={{display:'inline-flex',alignItems:'center'}} />;
    }

    function Toast({ message, visible }) {

          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />

    }

      return (
        <div className={`rounded-lg border gold-border bg-navy-mid/80 shadow-xl ring-1 ring-gold/5 backdrop-blur-sm ${className}`}>
          {children}
        </div>
      );
    }

    function App() {
      const [events, setEvents]       = useState(loadEvents);
      const [nombre, setNombre]       = useState('');
      const [mes, setMes]             = useState('');
      const [dia, setDia]             = useState('');
      const [tipo, setTipo]           = useState('');
      const [notifPerm, setNotifPerm] = useState(() => typeof Notification !== 'undefined' ? Notification.permission : 'denied');
      const [toast, setToast]         = useState({ msg:'', visible:false });
      const [loading, setLoading]     = useState(true);
      // Pantalla de bienvenida: visible siempre al iniciar (se cierra con el botón).
      // No usa localStorage → vuelve a aparecer cada vez que se instala/reinstala.
      const [showWelcome, setShowWelcome] = useState(true);
      const toastTimer = useRef(null);

      // ── FIX 3: inicialización con periodic sync y re-registro de token ──────
      // Antes: solo registraba el token si el permiso ya estaba concedido.
      // Ahora: además registra el periodic sync para Android Chrome, y re-registra
      // el token FCM en cada apertura (garantizando que Firestore siempre lo tenga).
      useEffect(() => {
        registerServiceWorker().then(async reg => {
          if (reg && Notification.permission === 'granted') {
            // Re-registrar token en cada apertura (Fix 1 lo hace idempotente y seguro)
            if (window._registrarTokenFCM) await window._registrarTokenFCM();
            // Registrar periodic sync para Android Chrome (Fix 2)
            await registrarPeriodicSync(reg);
          }
        });
      }, []);

      // Firebase Listener
      useEffect(() => {
        if (!db) {
          setLoading(false);
          return;
        }
        const unsub = db.collection('eventos').onSnapshot(
          snap => {
            const fbEvents = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
            setEvents(fbEvents);
            saveEvents(fbEvents);
            setLoading(false);
            if (Notification.permission === 'granted') syncEventsToSW(fbEvents);
          },
          err => {
            console.warn('Firebase error:', err);
            setLoading(false);
          }
        );
        return () => unsub();
      }, []);

      const showToast = useCallback((msg) => {
        clearTimeout(toastTimer.current);
        setToast({ msg, visible: true });
        toastTimer.current = setTimeout(() => setToast(t => ({ ...t, visible: false })), 2800);
      }, []);

      // Cálculo seguro de eventos ordenados
      const sorted = useMemo(() => {
        if (!events || !Array.isArray(events)) return [];
        return [...events].sort((a,b) => daysUntil(a.fecha) - daysUntil(b.fecha));
      }, [events]);

      async function handleSave() {
        if (!nombre.trim()) { showToast('Ingresa el nombre'); return; }
        if (!mes || !dia)    { showToast('Selecciona mes y día'); return; }
        if (!tipo)           { showToast('Selecciona el tipo de evento'); return; }
        const fecha = `${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        const ev = { id: Date.now(), nombre: nombre.trim(), fecha, tipo };
        await saveEventToFirebase(ev);
        setNombre(''); setMes(''); setDia(''); setTipo('');
        showToast('Evento registrado ✦');
      }

      async function handleDelete(id) {
        const ev = events.find(e => (e.id === id) || (e.docId === id));
        if (ev) await deleteEventFromFirebase(ev);
        showToast('Evento eliminado');
      }

      // ── FIX 4: handleNotify también registra el periodic sync ────────────────
      // Cuando el usuario activa las notificaciones por primera vez, ahora también
      // se registra el periodic sync, no solo el token FCM.
      async function handleNotify() {
        if (!('Notification' in window)) { showToast('Navegador no soportado'); return; }
        const perm = await Notification.requestPermission();
        setNotifPerm(perm);
        if (perm === 'granted') {
          await syncEventsToSW(events);
          if (window._registrarTokenFCM) await window._registrarTokenFCM();
          // Registrar periodic sync al activar notificaciones
          const reg = swRegistration || await registerServiceWorker();
          if (reg) await registrarPeriodicSync(reg);
          showToast('Notificaciones activadas ✦');
        } else {
          showToast('Permiso denegado');
        }
      }

      if (showWelcome) {
        return <WelcomeScreen onClose={() => setShowWelcome(false)} />;
      }

      if (loading) {
        return (
          <div className="min-h-screen bg-navy bg-grid flex items-center justify-center">
            <div className="text-center">
              <div className="text-gold text-4xl mb-4">✦</div>
              <p className="font-cinzel text-gold/70 text-sm tracking-widest uppercase">Cargando eventos...</p>
            </div>
          </div>
        );
      }

      const notifGranted = notifPerm === 'granted';

      return (
        <div className="min-h-screen bg-navy bg-grid">
          <header className="sticky top-0 z-40 bg-navy/95 backdrop-blur border-b gold-border">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
              <div>
                <h1 className="font-cinzel text-gold-light tracking-widest uppercase text-sm font-bold leading-tight">Registro de Eventos</h1>
                <p className="font-cinzel text-gold/50 tracking-[0.2em] uppercase text-xs mt-0.5">Oriente Fraterno · 148</p>
              </div>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pb-24">
            <Divider label="Notificaciones" />
            <Card className="p-4">
              <button onClick={handleNotify} className={`w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded font-cinzel text-xs tracking-widest uppercase border transition-all ${notifGranted ? 'border-gold/50 text-gold-light bg-gold/10' : 'border-gold/30 text-gold hover:bg-gold/10'}`}>
                <Icon name={notifGranted ? 'BellRing' : 'Bell'} size={15} />
                {notifGranted ? 'Notificaciones Activas ✦' : 'Activar Notificaciones Web'}
              </button>
            </Card>

            <Divider label="Nuevo Registro" />
            <Card className="p-5">
              <div className="space-y-4">
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">Nombre</label>
                  <input type="text" value={nombre} onChange={e => setNombre(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSave()} placeholder="Ej: José López" className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base placeholder-white/25 focus:outline-none gold-glow focus:border-gold/70 transition" />
                </div>
                <div className="flex gap-2">
                  <select value={mes} onChange={e => setMes(e.target.value)} className="flex-1 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Mes —</option>
                    {['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((m,i) => (
                      <option key={i+1} value={String(i+1).padStart(2,'0')}>{m}</option>
                    ))}
                  </select>
                  <select value={dia} onChange={e => setDia(e.target.value)} className="w-28 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Día —</option>
                    {(() => {
                      // Días válidos según el mes seleccionado.
                      // Febrero: máximo 29 (incluye el 29/Feb para aniversarios de
                      // bisiestos; el workflow lo entrega el 28/Feb en años no bisiestos).
                      const diasPorMes = [31,29,31,30,31,30,31,31,30,31,30,31];
                      const maxDias = mes ? diasPorMes[parseInt(mes,10) - 1] : 31;
                      // Si el día seleccionado ya no es válido para el nuevo mes, resetear
                      if (dia && parseInt(dia,10) > maxDias) { setTimeout(() => setDia(''), 0); }
                      return Array.from({length: maxDias}, (_,i) => i+1).map(d => (
                        <option key={d} value={String(d).padStart(2,'0')}>{d}</option>
                      ));
                    })()}
                  </select>
                </div>
                <select value={tipo} onChange={e => setTipo(e.target.value)} className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                  <option value="">— Seleccionar evento —</option>
                  {TIPOS.map(t => ( <option key={t.value} value={t.value}>{t.emoji} {t.label}</option> ))}
                </select>
                <button onClick={handleSave} className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold shadow-lg shadow-gold/20 flex items-center justify-center gap-2">
                  <Icon name="PlusCircle" size={15} /> Registrar Evento
                </button>
              </div>
            </Card>

            <Divider label={`Eventos Registrados (${sorted.length})`} />
            <Card className="p-3">
              {sorted.length === 0 ? (
                <div className="text-center py-12 text-white/25 italic text-sm">No hay eventos registrados aún.</div>
              ) : (
                <div className="space-y-2">
                  {sorted.map((ev) => {
                    const cfg = TIPOS.find(t => t.value === ev.tipo) || { emoji: '📌' };
                    const days = daysUntil(ev.fecha);
                    return (
                      <div key={ev.docId || ev.id} className={`flex items-center gap-3 p-3 rounded border ${TIPO_STYLES[ev.tipo] || 'bg-navy/50 border-white/10'}`}>
                        <div className="w-10 h-10 rounded-full border border-gold/20 flex items-center justify-center text-lg bg-black/20">{cfg.emoji}</div>
                        <div className="flex-1 min-w-0">
                          <p className="font-cinzel text-white text-sm font-semibold truncate">{ev.nombre}</p>
                          <p className="text-gold text-xs uppercase">{ev.tipo} · {formatDate(ev.fecha)}</p>
                          <p className="text-white/40 text-xs">{days === 0 ? 'HOY ✦' : `En ${days} días`}</p>
                        </div>
                        <button onClick={() => handleDelete(ev.docId || ev.id)} className="p-1.5 text-red-500/60 hover:text-red-400"><Icon name="Trash2" size={14} /></button>
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>
          </main>
          <footer className="text-center pb-8 pt-2">
            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
          </footer>
          <Toast message={toast.msg} visible={toast.visible} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      try {
        ReactDOM.createRoot(rootElement).render(<App />);
      } catch (e) {
        rootElement.innerHTML = '<div style="color:white;text-align:center;padding:20px;">Error al iniciar React: ' + e.message + '</div>';
      }
    }
  </script>
</body>
</html>
