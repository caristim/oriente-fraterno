<script>
// ===============================
// SERVICE WORKER
// ===============================
let swRegistration = null;

const swCode = `
let events = [];

self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));

self.addEventListener('message', event => {
  if (event.data.type === 'SYNC_EVENTS') {
    events = event.data.events;
    scheduleNotifications();
  }
});

function scheduleNotifications() {
  events.forEach(ev => {
    const now = Date.now();
    const eventTime = new Date(ev.date).getTime();

    if (eventTime > now) {
      const delay = eventTime - now;

      setTimeout(() => {
        self.registration.showNotification(ev.title, {
          body: ev.description || 'Recordatorio',
          icon: 'icon.png'
        });
      }, delay);
    }
  });
}
`;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;

  try {
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);

    swRegistration = await navigator.serviceWorker.register(url);
    await navigator.serviceWorker.ready;

    return swRegistration;
  } catch (err) {
    console.error(err);
    return null;
  }
}

// ===============================
// NOTIFICACIONES
// ===============================
async function handleNotify() {

  if (!('Notification' in window)) {
    alert('Navegador no compatible');
    return;
  }

  if (!window.isSecureContext) {
    alert('Debes usar HTTPS');
    return;
  }

  try {
    if (!swRegistration) {
      await registerServiceWorker();
    }

    if (!swRegistration) {
      alert('Error en Service Worker');
      return;
    }

    if (Notification.permission === 'granted') {
      alert('Ya están activadas');
      return;
    }

    if (Notification.permission === 'denied') {
      alert('Permiso bloqueado');
      return;
    }

    const perm = await Notification.requestPermission();

    if (perm === 'granted') {
      swRegistration.active.postMessage({
        type: 'SYNC_EVENTS',
        events: events // usa tu array actual
      });

      alert('Notificaciones activadas');
    } else {
      alert('Permiso denegado');
    }

  } catch (err) {
    console.error(err);
    alert('Error al activar');
  }
}

// ===============================
// INIT
// ===============================
window.addEventListener('load', async () => {
  await registerServiceWorker();
});
</script>
