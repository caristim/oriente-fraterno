<body class="bg-navy text-white bg-grid min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Constants ──────────────────────────────────────────────────
    const STORAGE_KEY = 'orienteFraterno_v2';

    const TIPOS = [
      { value: 'Cumpleaños',               label: 'Cumpleaños',               emoji: '🎂' },
      { value: 'Fecha de casamiento',       label: 'Fecha de casamiento',       emoji: '💍' },
      { value: 'Aniversario',               label: 'Aniversario',               emoji: '🌹' },
      { value: 'Pasaje al Oriente Eterno',  label: 'Pasaje al Oriente Eterno',  emoji: '✦'  },
    ];

    const TIPO_STYLES = {
      'Cumpleaños':               'bg-amber-900/20  border-amber-600/30',
      'Fecha de casamiento':      'bg-purple-900/20 border-purple-500/30',
      'Aniversario':              'bg-rose-900/20   border-rose-600/30',
      'Pasaje al Oriente Eterno': 'bg-slate-800/50  border-slate-500/30',
    };

    // ── Helpers ────────────────────────────────────────────────────
    function loadEvents()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
    function saveEvents(l) { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); }

    // ── Firebase sync ──────────────────────────────────────────────
    async function saveEventToFirebase(ev) {
      try { await db.collection('eventos').doc(String(ev.id)).set(ev); } catch(e) { console.warn(e); }
    }

    async function deleteEventFromFirebase(ev) {
      try {
        const docId = ev.docId || String(ev.id);
        await db.collection('eventos').doc(docId).delete();
      } catch(e) { console.warn(e); }
    }

    function formatDate(iso) {
      if (!iso) return '';
      const parts = iso.split('-');
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      if (parts.length === 2) {
        return `${parts[1]} ${months[+parts[0] - 1]}`;
      }
      const [, m, d] = parts;
      return `${d} ${months[+m - 1]}`;
    }

    function daysUntil(iso) {
      const today = new Date(); today.setHours(0,0,0,0);
      const parts = iso.split('-');
      let m, d;
      if (parts.length === 2) {
        [m, d] = parts;
      } else {
        [, m, d] = parts;
      }
      let next = new Date(today.getFullYear(), +m - 1, +d);
      if (next < today) next.setFullYear(next.getFullYear() + 1);
      return Math.round((next - today) / 86400000);
    }

    // ── Service Worker ──────────────────────────────────────────────
    let swRegistration = null;

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        // Forzar actualización del SW si hay una versión nueva
        swRegistration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });

        // Forzar activación inmediata si hay un SW esperando
        if (swRegistration.waiting) {
          swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        // Escuchar nuevas instalaciones
        swRegistration.addEventListener('updatefound', () => {
          const newSW = swRegistration.installing;
          if (newSW) {
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          }
        });

        // Esperar a que el SW esté activo
        if (swRegistration.installing) {
          await new Promise(resolve => {
            swRegistration.installing.addEventListener('statechange', function handler(e) {
              if (e.target.state === 'activated') {
                e.target.removeEventListener('statechange', handler);
                resolve();
              }
            });
          });
        }

        // Periodic sync si está soportado (Chrome Android, user engagement alto)
        if ('periodicSync' in swRegistration) {
          try {
            const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
            if (status.state === 'granted') {
              await swRegistration.periodicSync.register('of-daily-check', {
                minInterval: 12 * 60 * 60 * 1000 // 12 horas
              });
              console.log('[App] periodicSync registrado');
            }
          } catch (_) { /* periodicSync puede no estar disponible */ }
        }

        return swRegistration;
      } catch (err) {
        console.warn('[App] SW registration failed:', err);
        return null;
      }
    }

    function waitForActiveSW(reg, timeoutMs = 5000) {
      if (reg && reg.active) return Promise.resolve(reg.active);
      return new Promise((resolve) => {
        if (!reg) { resolve(null); return; }
        const timer = setTimeout(() => resolve(null), timeoutMs);
        const checkState = (sw) => {
          sw.addEventListener('statechange', function handler() {
            if (sw.state === 'activated') {
              sw.removeEventListener('statechange', handler);
              clearTimeout(timer);
              resolve(sw);
            }
          });
        };
        if (reg.waiting)    checkState(reg.waiting);
        if (reg.installing) checkState(reg.installing);
        reg.addEventListener('updatefound', () => {
          if (reg.installing) checkState(reg.installing);
        });
      });
    }

    async function syncEventsToSW(events) {
      try {
        const reg = swRegistration || await registerServiceWorker();
        if (!reg) return;
        const sw = await waitForActiveSW(reg, 5000);
        if (!sw) { console.warn('[App] SW no disponible para sync'); return; }
        sw.postMessage({ type: 'SCHEDULE_EVENTS', events });
        console.log('[App] eventos enviados al SW:', events.length);

        // También registrar Background Sync (one-shot) como respaldo
        if ('sync' in reg) {
          try { await reg.sync.register('of-check'); } catch (_) {}
        }
      } catch (err) {
        console.warn('[App] syncEventsToSW error:', err);
      }
    }

    // ── Icon wrapper (Lucide via UMD) ──────────────────────────────
    function Icon({ name, size = 18, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide[name] || lucide['HelpCircle']);
          icon.setAttribute('width', size);
          icon.setAttribute('height', size);
          if (className) icon.setAttribute('class', className);
          ref.current.appendChild(icon);
        }
      }, [name, size, className]);
      return <span ref={ref} style={{display:'inline-flex',alignItems:'center'}} />;
    }

    // ── Toast ──────────────────────────────────────────────────────
    function Toast({ message, visible }) {
      return (
        <div
          className={`fixed bottom-6 left-1/2 z-50 px-5 py-2.5 rounded-full
            bg-gradient-to-r from-gold to-gold-light text-navy-DEFAULT
            font-cinzel text-xs tracking-widest uppercase shadow-lg pointer-events-none
            ${visible ? 'toast-in' : 'toast-out opacity-0'}`}
          style={{ transform: 'translateX(-50%)', whiteSpace: 'nowrap' }}
        >
          {message}
        </div>
      );
    }

    // ── Divider ────────────────────────────────────────────────────
    function Divider({ label }) {
      return (
        <div className="flex items-center gap-3 my-6">
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
          <span className="font-cinzel text-gold text-xs tracking-widest uppercase">{label}</span>
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
        </div>
      );
    }

    // ── Card ───────────────────────────────────────────────────────
    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-lg border gold-border bg-navy-mid/80 shadow-xl
          ring-1 ring-gold/5 backdrop-blur-sm ${className}`}>
          {children}
        </div>
      );
    }

    // ── App ────────────────────────────────────────────────────────
    function App() {
      const [events, setEvents]       = useState(loadEvents);
      const [nombre, setNombre]       = useState('');
      const [mes, setMes]             = useState('');
      const [dia, setDia]             = useState('');
      const [tipo, setTipo]           = useState('');
      const [notifPerm, setNotifPerm] = useState(() => typeof Notification !== 'undefined' ? Notification.permission : 'denied');
      const [toast, setToast]         = useState({ msg:'', visible:false });
      const [loading, setLoading]     = useState(true);
      const toastTimer = useRef(null);

      // Registrar SW al montar (antes de cargar Firebase)
      useEffect(() => {
        registerServiceWorker().then(reg => {
          // Si ya tiene permiso, sincronizar eventos locales mientras carga Firebase
          if (reg && Notification.permission === 'granted') {
            const cached = loadEvents();
            if (cached.length > 0) syncEventsToSW(cached);
          }
        });
      }, []);

      // Cargar desde Firebase con listener en tiempo real
      useEffect(() => {
        const unsub = db.collection('eventos').onSnapshot(
          snap => {
            const fbEvents = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
            setEvents(fbEvents);
            saveEvents(fbEvents);
            setLoading(false);
            // Sincronizar con SW cada vez que cambien los eventos
            if (Notification.permission === 'granted') {
              syncEventsToSW(fbEvents);
            }
          },
          err => {
            console.warn('Firebase error:', err);
            setLoading(false);
          }
        );
        return () => unsub();
      }, []);

      const showToast = useCallback((msg) => {
        clearTimeout(toastTimer.current);
        setToast({ msg, visible: true });
        toastTimer.current = setTimeout(() => setToast(t => ({ ...t, visible: false })), 2800);
      }, []);

      const sorted = [...events].sort((a,b) => daysUntil(a.fecha) - daysUntil(b.fecha));

      async function handleSave() {
        if (!nombre.trim()) { showToast('Ingresa el nombre'); return; }
        if (!mes || !dia)    { showToast('Selecciona mes y día'); return; }
        if (!tipo)           { showToast('Selecciona el tipo de evento'); return; }
        const mesStr = String(mes).padStart(2,'0');
        const diaStr = String(dia).padStart(2,'0');
        const fecha = `${mesStr}-${diaStr}`;
        const ev = { id: Date.now(), nombre: nombre.trim(), fecha, tipo };
        await saveEventToFirebase(ev);
        setNombre(''); setMes(''); setDia(''); setTipo('');
        showToast('Evento registrado ✦');
        // La sincronización con SW se hará automáticamente cuando Firebase actualice
      }

      async function handleDelete(id) {
        const ev = events.find(e => (e.id === id) || (e.docId === id));
        if (ev) await deleteEventFromFirebase(ev);
        showToast('Evento eliminado');
      }

      async function handleNotify() {
        if (!('Notification' in window)) { showToast('Navegador no soportado'); return; }
        if (notifPerm === 'granted') {
          // Ya tiene permiso: re-sincronizar eventos con el SW
          await syncEventsToSW(events);
          showToast('Notificaciones ya activas ✦');
          return;
        }
        const perm = await Notification.requestPermission();
        setNotifPerm(perm);
        if (perm === 'granted') {
          await syncEventsToSW(events);
          showToast('Notificaciones activadas ✦');
        } else {
          showToast('Permiso denegado');
        }
      }

      const notifGranted = notifPerm === 'granted';

      if (loading) return (
        <div className="min-h-screen bg-navy bg-grid flex items-center justify-center">
          <div className="text-center">
            <div className="text-gold text-4xl mb-4">✦</div>
            <p className="font-cinzel text-gold/70 text-sm tracking-widest uppercase">Cargando eventos...</p>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-navy bg-grid">

          {/* ── Header ── */}
          <header className="sticky top-0 z-40 bg-navy/95 backdrop-blur border-b gold-border">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
              <div>
                <h1 className="font-cinzel text-gold-light tracking-widest uppercase text-sm font-bold leading-tight">
                  Registro de Eventos
                </h1>
                <p className="font-cinzel text-gold/50 tracking-[0.2em] uppercase text-xs mt-0.5">
                  Oriente Fraterno · 148
                </p>
              </div>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pb-24">

            {/* ── Notifications ── */}
            <Divider label="Notificaciones" />
            <Card className="p-4">
              <button
                onClick={handleNotify}
                className={`w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded
                  font-cinzel text-xs tracking-widest uppercase border transition-all
                  ${notifGranted
                    ? 'border-gold/50 text-gold-light bg-gold/10'
                    : 'border-gold/30 text-gold hover:bg-gold/10'}`}
              >
                <Icon name={notifGranted ? 'BellRing' : 'Bell'} size={15} />
                {notifGranted ? 'Notificaciones Activas ✦' : 'Activar Notificaciones Web'}
              </button>
              <p className="text-center text-gold/50 text-xs italic mt-2 tracking-wide">
                {notifGranted
                  ? 'Service Worker activo · Recibirás alertas a las 9:00 AM en cada fecha ✦'
                  : 'Activa para recibir alertas a las 9:00 AM en cada fecha'}
              </p>
            </Card>

            {/* ── Form ── */}
            <Divider label="Nuevo Registro" />
            <Card className="p-5">
              <div className="space-y-4">

                {/* Nombre */}
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">
                    Nombre
                  </label>
                  <input
                    type="text"
                    value={nombre}
                    onChange={e => setNombre(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSave()}
                    placeholder="Ej: José López"
                    className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5
                      text-white font-crimson text-base placeholder-white/25
                      focus:outline-none gold-glow focus:border-gold/70 transition"
                  />
                </div>

                {/* Fecha */}
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">
                    Fecha del Evento
                  </label>
                  <div className="flex gap-2">
                    <div className="relative flex-1">
                      <select
                        value={mes}
                        onChange={e => setMes(e.target.value)}
                        className="w-full appearance-none bg-navy/70 border gold-border rounded px-3 py-2.5
                          text-white font-crimson text-base cursor-pointer
                          focus:outline-none gold-glow focus:border-gold/70 transition pr-8"
                      >
                        <option value="">— Mes —</option>
                        {['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((m,i) => (
                          <option key={i+1} value={String(i+1).padStart(2,'0')}>{m}</option>
                        ))}
                      </select>
                      <div className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gold">
                        <Icon name="ChevronDown" size={14} />
                      </div>
                    </div>
                    <div className="relative w-28">
                      <select
                        value={dia}
                        onChange={e => setDia(e.target.value)}
                        className="w-full appearance-none bg-navy/70 border gold-border rounded px-3 py-2.5
                          text-white font-crimson text-base cursor-pointer
                          focus:outline-none gold-glow focus:border-gold/70 transition pr-8"
                      >
                        <option value="">— Día —</option>
                        {Array.from({length:31},(_,i)=>i+1).map(d => (
                          <option key={d} value={String(d).padStart(2,'0')}>{d}</option>
                        ))}
                      </select>
                      <div className="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gold">
                        <Icon name="ChevronDown" size={14} />
                      </div>
                    </div>
                  </div>
                </div>

                {/* Tipo */}
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">
                    Tipo de Evento
                  </label>
                  <div className="relative">
                    <select
                      value={tipo}
                      onChange={e => setTipo(e.target.value)}
                      className="w-full appearance-none bg-navy/70 border gold-border rounded px-3 py-2.5
                        text-white font-crimson text-base cursor-pointer
                        focus:outline-none gold-glow focus:border-gold/70 transition pr-10"
                    >
                      <option value="">— Seleccionar evento —</option>
                      {TIPOS.map(t => (
                        <option key={t.value} value={t.value}>{t.emoji} {t.label}</option>
                      ))}
                    </select>
                    <div className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gold">
                      <Icon name="ChevronDown" size={16} />
                    </div>
                  </div>
                </div>

                {/* Submit */}
                <button
                  onClick={handleSave}
                  className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase
                    bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold
                    hover:brightness-110 active:scale-[0.98] transition-all
                    shadow-lg shadow-gold/20 flex items-center justify-center gap-2"
                >
                  <Icon name="PlusCircle" size={15} />
                  Registrar Evento
                </button>
              </div>
            </Card>

            {/* ── List ── */}
            <Divider label={`Eventos Registrados${events.length ? ` (${events.length})` : ''}`} />
            <Card className="p-3">
              {sorted.length === 0 ? (
                <div className="text-center py-12 text-white/25">
                  <div className="text-4xl mb-3 opacity-40">✦</div>
                  <p className="font-crimson italic text-sm tracking-wide">
                    No hay eventos registrados aún.<br />Ingresa el primer registro.
                  </p>
                </div>
              ) : (
                <div className="space-y-2">
                  {sorted.map((ev) => {
                    const cfg  = TIPOS.find(t => t.value === ev.tipo) || { emoji: '📌' };
                    const days = daysUntil(ev.fecha);
                    const isToday = days === 0;
                    const soon    = days <= 7 && days > 0;
                    return (
                      <div
                        key={ev.docId || ev.id}
                        className={`fade-in flex items-center gap-3 p-3 rounded border transition-all
                          hover:border-gold/40 ${TIPO_STYLES[ev.tipo] || 'bg-navy/50 border-white/10'}`}
                      >
                        {/* Emoji badge */}
                        <div className="flex-shrink-0 w-10 h-10 rounded-full border border-gold/20
                          flex items-center justify-center text-lg bg-black/20">
                          {cfg.emoji}
                        </div>

                        {/* Details */}
                        <div className="flex-1 min-w-0">
                          <p className="font-cinzel text-white text-sm font-semibold truncate">
                            {ev.nombre}
                          </p>
                          <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5">
                            <span className="font-cinzel text-gold text-xs tracking-wide uppercase">
                              {ev.tipo}
                            </span>
                            <span className="text-white/40 text-xs">·</span>
                            <span className="text-white/50 text-xs">{formatDate(ev.fecha)}</span>
                          </div>
                          {/* Days badge */}
                          <div className="mt-1">
                            {isToday ? (
                              <span className="inline-flex items-center gap-1 text-xs bg-gold/20 text-gold-light
                                border border-gold/30 rounded-full px-2 py-0.5 font-cinzel tracking-wider">
                                <Icon name="Star" size={10} /> HOY
                              </span>
                            ) : soon ? (
                              <span className="inline-flex items-center gap-1 text-xs bg-amber-900/30 text-amber-300
                                border border-amber-600/20 rounded-full px-2 py-0.5 font-cinzel tracking-wider">
                                <Icon name="Clock" size={10} /> En {days} día{days !== 1 ? 's' : ''}
                              </span>
                            ) : (
                              <span className="text-white/30 text-xs">
                                En {days} días
                              </span>
                            )}
                          </div>
                        </div>

                        {/* Delete */}
                        <button
                          onClick={() => handleDelete(ev.docId || ev.id)}
                          className="flex-shrink-0 p-1.5 rounded border border-red-900/40 text-red-500/60
                            hover:bg-red-900/20 hover:text-red-400 hover:border-red-700/50 transition-all"
                          title="Eliminar"
                        >
                          <Icon name="Trash2" size={14} />
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>

          </main>

          {/* ── Footer ── */}
          <footer className="text-center pb-8 pt-2">
            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
          </footer>

          {/* ── Toast ── */}
          <Toast message={toast.msg} visible={toast.visible} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
