  <style>
    body { font-family: 'Crimson Pro', Georgia, serif; background-color: #0f172a; color: white; }

<body class="bg-grid min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [notifPerm, setNotifPerm] = useState(Notification.permission);

      useEffect(() => {
        // Registrar Service Worker físico
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW Registrado'))
            .catch(err => console.error('Error SW:', err));
        }
      }, []);

      const requestPermission = async () => {
        const permission = await Notification.requestPermission();
        setNotifPerm(permission);
        if (permission === 'granted') {
          alert("¡Notificaciones activadas!");
        }
      };

      return (
        <div className="max-w-lg mx-auto p-4">
          <header className="flex justify-between items-center py-6 border-b border-yellow-900/30">
            <div>
              <h1 className="text-xl font-bold text-yellow-600 tracking-widest uppercase">Oriente Fraterno</h1>
              <p className="text-xs text-yellow-700 italic">Logia N° 148</p>
            </div>
            <button 
              onClick={requestPermission}
              className={`p-2 rounded-full border ${notifPerm === 'granted' ? 'border-yellow-600 text-yellow-600' : 'border-gray-600 text-gray-500'}`}
            >
              <i data-lucide={notifPerm === 'granted' ? "bell" : "bell-off"}></i>
            </button>
          </header>

          <main className="mt-8">
             {/* El resto de tu lógica de React de visualización de eventos va aquí */}
             <div className="bg-navy-800 p-6 rounded-lg border border-yellow-900/20 text-center">
                <p className="text-yellow-600/80 italic">Cargando registros de la Logia...</p>
             </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    setTimeout(() => lucide.createIcons(), 500);
  </script>
</body>
</html>
