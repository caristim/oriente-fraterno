  <!-- === INICIO: AGREGADO PARA NOTIFICACIONES PUSH === -->
  <script>
    // 1. Registrar Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
         .then(reg => {
            console.log('[SW] Registrado:', reg.scope);
            // 2. Inicializar FCM después de registrar SW
            inicializarNotificacionesPush(reg);
          })
         .catch(err => console.error('[SW] Error al registrar:', err));
      });
    }

    // 3. Pedir permiso y guardar token FCM
    function inicializarNotificacionesPush(swReg) {
      const VAPID_KEY = 'BM1SqlyjKhW45Y2JSBqDTYRT5QBV0yduJBtonc_QrlqM1DgaDmanz_w1R0Qj40ZuiG-rz4s4stIqBuYmciutG9Y'; //
      
      // Verificar si ya se pidió permiso antes
      if (Notification.permission === 'granted') {
        obtenerYGuardarToken(VAPID_KEY, swReg);
      } else if (Notification.permission!== 'denied') {
        // Pedir permiso con un delay para no ser invasivo al cargar
        setTimeout(() => {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              console.log('[FCM] Permiso concedido');
              obtenerYGuardarToken(VAPID_KEY, swReg);
            } else {
              console.log('[FCM] Permiso denegado');
            }
          });
        }, 3000);
      }
    }

    function obtenerYGuardarToken(vapidKey, swReg) {
      messaging.getToken({ 
        vapidKey: vapidKey,
        serviceWorkerRegistration: swReg 
      }).then(token => {
        if (token) {
          console.log('[FCM] Token obtenido');
          guardarTokenEnFirestore(token);
        } else {
          console.log('[FCM] No se pudo obtener token');
        }
      }).catch(err => {
        console.error('[FCM] Error obteniendo token:', err);
      });

      // Escuchar renovación de token
      messaging.onTokenRefresh(() => {
        messaging.getToken({ vapidKey, serviceWorkerRegistration: swReg })
         .then(token => guardarTokenEnFirestore(token))
         .catch(err => console.error('[FCM] Error renovando token:', err));
      });
    }

    function guardarTokenEnFirestore(token) {
      // Evitar duplicados: usar el token como ID del documento
      const tokenRef = db.collection('fcm_tokens').doc(token);
      tokenRef.set({
        token: token,
        platform: /iPhone|iPad|iPod/.test(navigator.userAgent)? 'ios' : 'android',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastActive: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent: navigator.userAgent
      }, { merge: true })
     .then(() => console.log('[FCM] Token guardado en Firestore'))
     .catch(err => console.error('[FCM] Error guardando token:', err));
    }

    // 4. Manejar notificaciones en foreground
    messaging.onMessage(payload => {
      console.log('[FCM] Mensaje en foreground:', payload);
      const titulo = payload.data?.title || payload.notification?.title || 'Oriente Fraterno 148';
      const cuerpo = payload.data?.body || payload.notification?.body || 'Tenés un evento hoy';
      
      // Mostrar notificación manual si la app está abierta
      if (Notification.permission === 'granted') {
        new Notification(titulo, {
          body: cuerpo,
          icon: './icon-192.png',
          badge: './icon-192.png'
        });
      }
    });
  </script>
