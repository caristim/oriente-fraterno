  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

  <script>
    // ── Configuración Firebase ──────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            'AIzaSyD9gQW61AvKHhNai6gljNFE7q9rS7KKuN8',
      authDomain:        'orientefraterno148-2a0c1.firebaseapp.com',
      projectId:         'orientefraterno148-2a0c1',
      storageBucket:     'orientefraterno148-2a0c1.firebasestorage.app',
      messagingSenderId: '101867774014',
      appId:             '1:101867774014:web:0b4bb797293910c419716f',
    };

    // CORRECCIÓN: La VAPID key es para Web Push nativo (iOS/Firefox/Edge).
    // Es distinta al apiKey de Firebase. Debe coincidir con la que usa
    // el GitHub Action (secrets.OF_VAPID_PUBLIC_KEY).
    const VAPID_PUBLIC_KEY = 'BM1SqlyjKhW45Y2JSBqDTYRT5QBV0yduJBtonc_QrlqM1DgaDmanz_w1R0Qj40ZuiG-rz4s4stIqBuYmciutG9Y';

    let db          = null;
    let fcmReady    = false; // ¿el SDK de Firebase Messaging está listo?

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) {
      console.error('[App] Error al inicializar Firebase:', e);
    }

    // ── Detectores de plataforma ──────────────────────────────────────────
    function isIOSBrowser() {
      const ua = navigator.userAgent || '';
      return /iPhone|iPad|iPod/i.test(ua);
    }

    function isFirefoxBrowser() {
      return typeof InstallTrigger !== 'undefined'
          || (navigator.userAgent || '').toLowerCase().includes('firefox');
    }

    // CORRECCIÓN: detectar si FCM está disponible en este navegador.
    // FCM solo funciona en Chromium-based browsers (Chrome, Edge, Samsung Internet).
    // NO funciona en Firefox ni en iOS Safari (aunque esté como PWA).
    function isFCMCapable() {
      if (isIOSBrowser())    return false; // iOS Safari: usar Web Push nativo
      if (isFirefoxBrowser()) return false; // Firefox: usar Web Push nativo
      // Verificar que el navegador soporte la API de Firebase Messaging
      return typeof firebase !== 'undefined'
          && typeof firebase.messaging === 'function';
    }

    // ── Convertir VAPID key de base64url a Uint8Array ────────────────────
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    // ── Generar ID estable para la suscripción Web Push ──────────────────
    // CORRECCIÓN: btoa() puede fallar con caracteres Unicode en el endpoint.
    // Usamos una función de hash simple y segura.
    function hashEndpoint(endpoint) {
      let hash = 0;
      for (let i = 0; i < endpoint.length; i++) {
        const char = endpoint.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0; // Convertir a entero 32-bit
      }
      return 'wp_' + Math.abs(hash).toString(36);
    }

    // ── Registro Web Push nativo (iOS 16.4+, Firefox, Edge) ──────────────
    async function registrarWebPushNativo(swReg) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !db) return false;

        // Obtener el registro del SW para asociar la suscripción
        const reg = swReg || await navigator.serviceWorker.ready;

        // Verificar/obtener suscripción existente
        let sub = await reg.pushManager.getSubscription();

        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly:     true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
          });
        }

        if (!sub) return false;

        const subJson  = sub.toJSON();
        const endpoint = subJson.endpoint;
        const p256dh   = subJson.keys && subJson.keys.p256dh;
        const auth     = subJson.keys && subJson.keys.auth;

        if (!endpoint || !p256dh || !auth) return false;

        // CORRECCIÓN: ID estable basado en hash del endpoint (evita caracteres inválidos en Firestore)
        const docId = hashEndpoint(endpoint);

        const platform = isIOSBrowser()     ? 'ios'
                       : isFirefoxBrowser()  ? 'firefox'
                       : 'chromium';

        await db.collection('webpush_subscriptions').doc(docId).set({
          endpoint,
          p256dh,
          auth,
          platform,
          updatedAt: new Date().toISOString(),
        });

        console.log('[WebPush] Suscripción registrada. Platform:', platform);
        return true;
      } catch (err) {
        console.error('[WebPush] Error:', err.message);
        return false;
      }
    }

    // ── Registro FCM (Chrome / Edge Chromium / Samsung Internet) ─────────
    async function registrarTokenFCM(swReg) {
      try {
        if (!isFCMCapable() || !db) return false;

        const messaging = firebase.messaging();
        const reg       = swReg || await navigator.serviceWorker.ready;

        // CORRECCIÓN CRÍTICA: siempre pasar serviceWorkerRegistration.
        // Esto fuerza a FCM a usar nuestro sw.js en lugar de buscar
        // /firebase-messaging-sw.js en la raíz del dominio.
        const token = await messaging.getToken({
          vapidKey:                 VAPID_PUBLIC_KEY,
          serviceWorkerRegistration: reg,
        });

        if (!token) return false;

        // CORRECCIÓN: Limpiar token anterior si cambió
        const prevToken = localStorage.getItem('fcm_token');
        if (prevToken && prevToken !== token) {
          try {
            await db.collection('fcm_tokens').doc(prevToken).delete();
            console.log('[FCM] Token anterior eliminado de Firestore.');
          } catch (_) {}
        }

        await db.collection('fcm_tokens').doc(token).set({
          token,
          platform:  'chromium',
          updatedAt: new Date().toISOString(),
        });

        localStorage.setItem('fcm_token', token);

        // CORRECCIÓN: Escuchar renovación automática de token FCM.
        // Cuando FCM invalida el token (cada 1-2 meses), onTokenRefresh
        // se llama y aquí actualizamos Firestore automáticamente.
        messaging.onMessage(payload => {
          console.log('[FCM] Mensaje recibido en primer plano (app abierta):', payload);
          // No mostramos notificación aquí porque la app está visible.
          // El SW ya maneja el caso de background.
        });

        console.log('[FCM] Token registrado. Token:', token.substring(0, 24) + '...');
        fcmReady = true;
        return true;
      } catch (err) {
        console.error('[FCM] Error al registrar token:', err.message);
        return false;
      }
    }

    // ── Verificar y renovar token FCM al abrir la app ────────────────────
    // CORRECCIÓN CRÍTICA: Los tokens FCM expiran. Esta función verifica
    // si el token almacenado sigue siendo válido y lo renueva si es necesario.
    async function verificarYRenovarToken(swReg) {
      if (!isFCMCapable() || !db) return;
      try {
        const messaging = firebase.messaging();
        const reg       = swReg || await navigator.serviceWorker.ready;
        const nuevoToken = await messaging.getToken({
          vapidKey:                 VAPID_PUBLIC_KEY,
          serviceWorkerRegistration: reg,
        });
        if (!nuevoToken) return;

        const tokenGuardado = localStorage.getItem('fcm_token');
        if (nuevoToken !== tokenGuardado) {
          console.log('[FCM] Token renovado automáticamente.');
          if (tokenGuardado) {
            try { await db.collection('fcm_tokens').doc(tokenGuardado).delete(); } catch(_) {}
          }
          await db.collection('fcm_tokens').doc(nuevoToken).set({
            token:     nuevoToken,
            platform:  'chromium',
            updatedAt: new Date().toISOString(),
          });
          localStorage.setItem('fcm_token', nuevoToken);
        }
      } catch (err) {
        console.warn('[FCM] No se pudo renovar el token:', err.message);
      }
    }

    // ── Punto de entrada: activa notificaciones según plataforma ─────────
    async function activarNotificaciones(swReg) {
      if (!('Notification' in window)) {
        console.warn('[Notif] Este navegador no soporta notificaciones.');
        return false;
      }

      // Solicitar permiso si no está concedido
      if (Notification.permission !== 'granted') {
        const permiso = await Notification.requestPermission();
        if (permiso !== 'granted') {
          console.warn('[Notif] Permiso denegado por el usuario.');
          return false;
        }
      }

      let exito = false;

      if (isIOSBrowser() || isFirefoxBrowser()) {
        // iOS Safari / Firefox: SOLO Web Push nativo
        console.log('[Notif] Usando Web Push nativo (iOS/Firefox).');
        exito = await registrarWebPushNativo(swReg);
      } else {
        // Chrome / Edge: FCM + Web Push como respaldo
        console.log('[Notif] Usando FCM (Chromium).');
        const fcmOk = await registrarTokenFCM(swReg);
        if (fcmOk) {
          exito = true;
          // Web Push como canal de respaldo (por si FCM falla un día)
          await registrarWebPushNativo(swReg).catch(err =>
            console.warn('[Notif] Web Push de respaldo falló (no crítico):', err.message)
          );
        } else {
          // FCM falló: intentar solo con Web Push
          console.log('[Notif] FCM falló, intentando Web Push como respaldo.');
          exito = await registrarWebPushNativo(swReg);
        }
      }

      return exito;
    }

    window._activarNotificaciones = activarNotificaciones;
    window._verificarYRenovarToken = verificarYRenovarToken;
    // Alias legacy
    window._registrarTokenFCM = activarNotificaciones;
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;
    const STORAGE_KEY = 'orienteFraterno_v2';

    function detectPlatform() {
      const ua           = navigator.userAgent || '';
      const isIOS        = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid    = /Android/i.test(ua);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                        || window.navigator.standalone === true;
      return { isIOS, isAndroid, isStandalone };
    }

    function getIOSVersion() {
      const match = navigator.userAgent.match(/OS (\d+)_(\d+)/);
      if (!match) return null;
      return parseFloat(`${match[1]}.${match[2]}`);
    }

    // ── Pantalla de bienvenida ──────────────────────────────────────────────
    function WelcomeScreen({ onClose }) {
      const { isIOS, isAndroid } = detectPlatform();
      const [step, setStep]      = useState(1);
      const iosVersion           = getIOSVersion();
      const iosOld               = isIOS && iosVersion !== null && iosVersion < 16.4;
      const nextStep             = () => setStep(s => s + 1);

      return (
        <div className="fixed inset-0 z-50 bg-navy flex flex-col items-center justify-center px-6 bg-grid overflow-y-auto">
          <div className="w-full max-w-sm flex flex-col items-center gap-6 py-8">

              <div className="text-gold text-5xl mb-3">✦</div>

                Oriente Fraterno · 148
              </h1>
              <p className="font-cinzel text-gold/50 tracking-widest uppercase text-xs mt-1">
                Configuración de Notificaciones
              </p>
            </div>

            <div className="w-full rounded-lg border gold-border bg-navy-mid/80 shadow-xl ring-1 ring-gold/5 p-5 space-y-6">
              {step === 1 && (
                <div className="fade-in space-y-4">
                  {iosOld && (
                    <div className="bg-red-900/30 border border-red-500/40 rounded p-3">
                      <p className="font-crimson text-red-300 text-sm leading-snug">
                        ⚠️ Tu iOS ({iosVersion}) no soporta notificaciones web. Actualiza a iOS 16.4 o superior para poder recibirlas.
                      </p>
                    </div>
                  )}
                  <div className="flex gap-3 items-start">
                    <span className="bg-gold/20 text-gold w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">1</span>
                    <p className="font-crimson text-white/90 text-base leading-snug">
                      Al ingresar, toca el botón <span className="text-gold font-semibold">"Activar Notificaciones Web"</span> y acepta el permiso del navegador.
                    </p>
                  </div>
                  <div className="h-px bg-gold/15" />
                  <div className="flex gap-3 items-start">
                    <span className="bg-gold/20 text-gold w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">2</span>
                    <p className="font-crimson text-white/90 text-base leading-snug">
                      {isIOS
                        ? "En iOS, es obligatorio instalar la app usando 'Compartir' → 'Agregar al inicio' para recibir avisos."
                        : "Instala la app en tu pantalla de inicio para asegurar las notificaciones en segundo plano."}
                    </p>
                  </div>
                  <button onClick={nextStep} className="w-full py-3 mt-4 rounded font-cinzel text-xs tracking-widest uppercase bg-gold/10 border border-gold/30 text-gold font-bold">
                    Siguiente Paso ➔
                  </button>
                </div>
              )}

              {step === 2 && (
                <div className="fade-in space-y-4">
                  <h3 className="font-cinzel text-gold text-xs tracking-widest uppercase text-center mb-2">Ajuste de Segundo Plano</h3>

                  {isAndroid ? (
                    <div className="space-y-3">
                      <p className="font-crimson text-white/80 text-sm leading-tight italic">Para recibir avisos con la app cerrada en Android:</p>
                      <ul className="space-y-2 text-sm font-crimson text-white/90">
                        <li className="flex gap-2"><span>•</span> Mantén presionado el icono de la app.</li>
                        <li className="flex gap-2"><span>•</span> Toca <span className="text-gold">"Info de la aplicación"</span> (ícono ⓘ).</li>
                        <li className="flex gap-2"><span>•</span> Ve a <span className="text-gold">"Batería"</span> → selecciona <span className="text-gold">"Sin Restricciones"</span>.</li>
                      </ul>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <p className="font-crimson text-white/80 text-sm leading-tight italic">Para usuarios de iPhone/iPad:</p>
                      <ul className="space-y-2 text-sm font-crimson text-white/90">
                        <li className="flex gap-2"><span>•</span> Instala la app: <span className="text-gold">Compartir → Agregar al inicio</span>.</li>
                        <li className="flex gap-2"><span>•</span> Ve a <span className="text-gold">Ajustes → Notificaciones</span>.</li>
                        <li className="flex gap-2"><span>•</span> Busca <span className="text-gold">"Oriente Fraterno"</span> y activa todos los avisos.</li>
                      </ul>
                    </div>
                  )}

                  <div className="h-px bg-gold/15" />

                  <button
                    onClick={onClose}
                    className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold shadow-lg shadow-gold/20"
                  >
                    ¡Entendido, Terminar! ✦
                  </button>
                </div>
              )}
            </div>

            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
          </div>
        </div>
      );
    }

    const TIPOS = [
      { value: 'Cumpleaños',               label: 'Cumpleaños',               emoji: '🎂' },
      { value: 'Fecha de casamiento',       label: 'Fecha de casamiento',       emoji: '💍' },
      { value: 'Aniversario',               label: 'Aniversario',               emoji: '🌹' },
      { value: 'Pasaje al Oriente Eterno',  label: 'Pasaje al Oriente Eterno',  emoji: '✦'  },
    ];

    const TIPO_STYLES = {
      'Cumpleaños':               'bg-amber-900/20  border-amber-600/30',
      'Fecha de casamiento':      'bg-purple-900/20 border-purple-500/30',
      'Aniversario':              'bg-rose-900/20   border-rose-600/30',
      'Pasaje al Oriente Eterno': 'bg-slate-800/50  border-slate-500/30',
    };

    function loadEvents() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) return [];
        const parsed = JSON.parse(data);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) { return []; }
    }

    function saveEvents(l) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); } catch(e) {}
    }

    async function saveEventToFirebase(ev) {
      if (!db) return;
      try { await db.collection('eventos').doc(String(ev.id)).set(ev); } catch(e) {}
    }

    async function deleteEventFromFirebase(ev) {
      if (!db) return;
      try {
        const docId = ev.docId || String(ev.id);
        await db.collection('eventos').doc(docId).delete();
      } catch(e) {}
    }

    function formatDate(iso) {
      if (!iso || typeof iso !== 'string') return '';
      const parts  = iso.split('-');
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      if (parts.length === 2) return `${parts[1]} ${months[parseInt(parts[0]) - 1] || ''}`;
      if (parts.length === 3) return `${parts[2]} ${months[parseInt(parts[1]) - 1] || ''}`;
      return iso;
    }

    function daysUntil(iso) {
      if (!iso || typeof iso !== 'string') return 999;
      try {
        const today = new Date(); today.setHours(0,0,0,0);
        const parts = iso.split('-');
        let m, d;
        if (parts.length === 2) [m, d] = parts;
        else if (parts.length === 3) [, m, d] = parts;
        else return 999;
        let next = new Date(today.getFullYear(), parseInt(m) - 1, parseInt(d));
        if (isNaN(next.getTime())) return 999;
        if (next < today) next.setFullYear(next.getFullYear() + 1);
        return Math.round((next - today) / 86400000);
      } catch (e) { return 999; }
    }

    // ── Registro del Service Worker ───────────────────────────────────────
    let swRegistration = null;

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        // CORRECCIÓN: El SW se llama sw.js (no firebase-messaging-sw.js).
        // Usamos './sw.js' relativo a la URL base de la app.
        // Scope '/oriente-fraterno/' cubre toda la app en GitHub Pages.
        swRegistration = await navigator.serviceWorker.register('./sw.js', {
          scope:          '/oriente-fraterno/',
          updateViaCache: 'none', // Siempre verificar actualizaciones del SW
        });
        console.log('[App] SW registrado. Scope:', swRegistration.scope);

        // Escuchar actualizaciones del SW
        swRegistration.addEventListener('updatefound', () => {
          const newWorker = swRegistration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[App] Nueva versión del SW disponible.');
                // Activar automáticamente el nuevo SW
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          }
        });

        return swRegistration;
      } catch (err) {
        console.error('[App] Error registrando SW:', err);
        return null;
      }
    }

    async function syncEventsToSW(events) {
      try {
        const reg = swRegistration || await navigator.serviceWorker.ready;
        if (!reg) return;
        const worker = reg.active || reg.waiting || reg.installing;
        if (!worker) return;
        worker.postMessage({ type: 'SCHEDULE_EVENTS', events });
      } catch (err) {
        console.warn('[App] No se pudo sincronizar eventos con el SW:', err);
      }
    }

    // ── Componentes UI ────────────────────────────────────────────────────
    function Icon({ name, size = 18, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconType = lucide[name] || lucide['HelpCircle'];
          if (iconType) {
            const icon = lucide.createElement(iconType);
            icon.setAttribute('width', size);
            icon.setAttribute('height', size);
            if (className) icon.setAttribute('class', className);
            ref.current.appendChild(icon);
          }
        }
      }, [name, size, className]);
      return <span ref={ref} style={{display:'inline-flex',alignItems:'center'}} />;
    }

    function Toast({ message, visible }) {
      return (
        <div
          className={`fixed bottom-6 left-1/2 z-50 px-5 py-2.5 rounded-full bg-gradient-to-r from-gold to-gold-light text-navy font-cinzel text-xs tracking-widest uppercase shadow-lg pointer-events-none transition-all duration-300 ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}
          style={{ transform: 'translateX(-50%)' }}
        >
          {message}
        </div>
      );
    }

    function Divider({ label }) {
      return (
        <div className="flex items-center gap-3 my-6">
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
          <span className="font-cinzel text-gold text-xs tracking-widest uppercase">{label}</span>
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`rounded-lg border gold-border bg-navy-mid/80 shadow-xl ring-1 ring-gold/5 backdrop-blur-sm ${className}`}>
          {children}
        </div>
      );
    }

    // ── Componente principal ──────────────────────────────────────────────
    function App() {
      const [events, setEvents]           = useState(loadEvents);
      const [nombre, setNombre]           = useState('');
      const [mes, setMes]                 = useState('');
      const [dia, setDia]                 = useState('');
      const [tipo, setTipo]               = useState('');
      const [notifPerm, setNotifPerm]     = useState(() =>
        typeof Notification !== 'undefined' ? Notification.permission : 'denied'
      );
      const [toast, setToast]             = useState({ msg: '', visible: false });
      const [loading, setLoading]         = useState(true);
      const [showWelcome, setShowWelcome] = useState(true);
      const toastTimer                    = useRef(null);

      // CORRECCIÓN: El SW se registra INMEDIATAMENTE al montar el componente,
      // independientemente de si showWelcome está activo o no.
      // Antes solo se registraba al cerrar la pantalla de bienvenida,
      // lo que retrasaba el registro y perdía push events.
      useEffect(() => {
        (async () => {
          const reg = await registerServiceWorker();
          if (!reg) return;

          // CORRECCIÓN: Si ya tenía permiso (usuario recurrente),
          // renovar el token FCM automáticamente sin pedir permiso de nuevo.
          if (Notification.permission === 'granted') {
            await window._verificarYRenovarToken(reg).catch(() => {});
          }
        })();
      }, []); // Solo al montar

      // Suscripción en tiempo real a Firestore
      useEffect(() => {
        if (!db) { setLoading(false); return; }

        const unsub = db.collection('eventos').onSnapshot(
          snap => {
            const fbEvents = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
            setEvents(fbEvents);
            saveEvents(fbEvents);
            setLoading(false);
            // Sincronizar eventos con el SW para la verificación local
            if (Notification.permission === 'granted') syncEventsToSW(fbEvents);
          },
          err => {
            console.error('[App] Error en snapshot de Firestore:', err);
            setLoading(false);
          }
        );
        return () => unsub();
      }, []);

      const showToast = useCallback((msg) => {
        clearTimeout(toastTimer.current);
        setToast({ msg, visible: true });
        toastTimer.current = setTimeout(() =>
          setToast(t => ({ ...t, visible: false })), 2800
        );
      }, []);

      const sorted = useMemo(() => {
        if (!events || !Array.isArray(events)) return [];
        return [...events].sort((a,b) => daysUntil(a.fecha) - daysUntil(b.fecha));
      }, [events]);

      async function handleSave() {
        if (!nombre.trim()) { showToast('Ingresa el nombre'); return; }
        if (!mes || !dia)    { showToast('Selecciona mes y día'); return; }
        if (!tipo)           { showToast('Selecciona el tipo de evento'); return; }
        const fecha = `${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        const ev    = { id: Date.now(), nombre: nombre.trim(), fecha, tipo };
        await saveEventToFirebase(ev);
        setNombre(''); setMes(''); setDia(''); setTipo('');
        showToast('Evento registrado ✦');
      }

      async function handleDelete(id) {
        const ev = events.find(e => (e.id === id) || (e.docId === id));
        if (ev) await deleteEventFromFirebase(ev);
        showToast('Evento eliminado');
      }

      async function handleNotify() {
        if (!('Notification' in window)) { showToast('Navegador no soportado'); return; }
        showToast('Registrando dispositivo...');

        const reg   = swRegistration || await navigator.serviceWorker.ready.catch(() => null);
        const exito = await window._activarNotificaciones(reg);
        setNotifPerm(Notification.permission);

        if (exito) {
          await syncEventsToSW(events);
          showToast('Notificaciones activadas ✦');
        } else {
          if (Notification.permission === 'denied') {
            showToast('Permiso denegado. Revisá los ajustes del navegador.');
          } else {
            showToast('Error al activar. Intenta de nuevo.');
          }
        }
      }

      if (showWelcome) {
        return <WelcomeScreen onClose={() => setShowWelcome(false)} />;
      }

      if (loading) {
        return (
          <div className="min-h-screen bg-navy bg-grid flex items-center justify-center">
            <div className="text-center">
              <div className="text-gold text-4xl mb-4">✦</div>
              <p className="font-cinzel text-gold/70 text-sm tracking-widest uppercase">Cargando eventos...</p>
            </div>
          </div>
        );
      }

      const notifGranted = notifPerm === 'granted';

      return (
        <div className="min-h-screen bg-navy bg-grid">
          <header className="sticky top-0 z-40 bg-navy/95 backdrop-blur border-b gold-border">
            <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
              <div>
                <h1 className="font-cinzel text-gold-light tracking-widest uppercase text-sm font-bold leading-tight">Registro de Eventos</h1>
                <p className="font-cinzel text-gold/50 tracking-[0.2em] uppercase text-xs mt-0.5">Oriente Fraterno · 148</p>
              </div>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pb-24">
            <Divider label="Notificaciones" />
            <Card className="p-4">
              <button
                onClick={handleNotify}
                className={`w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded font-cinzel text-xs tracking-widest uppercase border transition-all ${notifGranted ? 'border-gold/50 text-gold-light bg-gold/10' : 'border-gold/30 text-gold hover:bg-gold/10'}`}
              >
                <Icon name={notifGranted ? 'BellRing' : 'Bell'} size={15} />
                {notifGranted ? 'Notificaciones Activas ✦' : 'Activar Notificaciones Web'}
              </button>
            </Card>

            <Divider label="Nuevo Registro" />
            <Card className="p-5">
              <div className="space-y-4">
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">Nombre</label>
                  <input
                    type="text"
                    value={nombre}
                    onChange={e => setNombre(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSave()}
                    placeholder="Ej: José López"
                    className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base placeholder-white/25 focus:outline-none gold-glow focus:border-gold/70 transition"
                  />
                </div>
                <div className="flex gap-2">
                  <select value={mes} onChange={e => setMes(e.target.value)} className="flex-1 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Mes —</option>
                    {['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((m,i) => (
                      <option key={i+1} value={String(i+1).padStart(2,'0')}>{m}</option>
                    ))}
                  </select>
                  <select value={dia} onChange={e => setDia(e.target.value)} className="w-28 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Día —</option>
                    {(() => {
                      const diasPorMes = [31,29,31,30,31,30,31,31,30,31,30,31];
                      const maxDias    = mes ? diasPorMes[parseInt(mes,10) - 1] : 31;
                      if (dia && parseInt(dia,10) > maxDias) { setTimeout(() => setDia(''), 0); }
                      return Array.from({length: maxDias}, (_,i) => i+1).map(d => (
                        <option key={d} value={String(d).padStart(2,'0')}>{d}</option>
                      ));
                    })()}
                  </select>
                </div>
                <select value={tipo} onChange={e => setTipo(e.target.value)} className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                  <option value="">— Seleccionar evento —</option>
                  {TIPOS.map(t => (<option key={t.value} value={t.value}>{t.emoji} {t.label}</option>))}
                </select>
                <button onClick={handleSave} className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold shadow-lg shadow-gold/20 flex items-center justify-center gap-2">
                  <Icon name="PlusCircle" size={15} /> Registrar Evento
                </button>
              </div>
            </Card>

            <Divider label={`Eventos Registrados (${sorted.length})`} />
            <Card className="p-3">
              {sorted.length === 0 ? (
                <div className="text-center py-12 text-white/25 italic text-sm">No hay eventos registrados aún.</div>
              ) : (
                <div className="space-y-2">
                  {sorted.map((ev) => {
                    const cfg  = TIPOS.find(t => t.value === ev.tipo) || { emoji: '📌' };
                    const days = daysUntil(ev.fecha);
                    return (
                      <div key={ev.docId || ev.id} className={`flex items-center gap-3 p-3 rounded border ${TIPO_STYLES[ev.tipo] || 'bg-navy/50 border-white/10'}`}>
                        <div className="w-10 h-10 rounded-full border border-gold/20 flex items-center justify-center text-lg bg-black/20">{cfg.emoji}</div>
                        <div className="flex-1 min-w-0">
                          <p className="font-cinzel text-white text-sm font-semibold truncate">{ev.nombre}</p>
                          <p className="text-gold text-xs uppercase">{ev.tipo} · {formatDate(ev.fecha)}</p>
                          <p className="text-white/40 text-xs">{days === 0 ? 'HOY ✦' : `En ${days} días`}</p>
                        </div>
                        <button onClick={() => handleDelete(ev.docId || ev.id)} className="p-1.5 text-red-500/60 hover:text-red-400">
                          <Icon name="Trash2" size={14} />
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>
          </main>

          <footer className="text-center pb-8 pt-2">
            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
            <p className="font-cinzel text-gold/20 text-[10px] tracking-widest uppercase mt-2">Creación: H.'. C. E. A. D. 2026</p>
          </footer>

          <Toast message={toast.msg} visible={toast.visible} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      try {
        ReactDOM.createRoot(rootElement).render(<App />);
      } catch (e) {
        rootElement.innerHTML = '<div style="color:white;text-align:center;padding:20px;">Error al iniciar React: ' + e.message + '</div>';
      }
    }
  </script>
</body>
</html>
