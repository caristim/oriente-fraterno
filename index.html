  <!-- ── Lógica de Firebase + Notificaciones ──────────────────────────── -->
  <script>
    const VAPID_PUBLIC_KEY = 'BNrCEJzq3O8KEEELwyOeRiHQU3911ptH6DYQ_2JuqYXim68Hw12IUfd8Z9dfz9kCEgyNKrNzPLrm0hzrz9UORKI';

    let db = null;
    try {
      firebase.initializeApp({
        apiKey:            'AIzaSyD9gQW61AvKHhNai6gljNFE7q9rS7KKuN8',
        authDomain:        'orientefraterno148-2a0c1.firebaseapp.com',
        projectId:         'orientefraterno148-2a0c1',
        storageBucket:     'orientefraterno148-2a0c1.firebasestorage.app',
        messagingSenderId: '101867774014',
        appId:             '1:101867774014:web:0b4bb797293910c419716f',
      });
      db = firebase.firestore();
    } catch(e) { console.error('[App] Firebase init error:', e.message); }

    function isIOS()     { return /iPhone|iPad|iPod/i.test(navigator.userAgent); }
    function isFirefox() { return /firefox/i.test(navigator.userAgent); }
    
    function urlBase64ToUint8Array(b64) {
      const pad  = '='.repeat((4 - b64.length % 4) % 4);
      const base = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
      return Uint8Array.from(atob(base), c => c.charCodeAt(0));
    }
    
    function hashEndpoint(ep) {
      let h = 0;
      for (let i = 0; i < ep.length; i++) h = Math.imul(31,h) + ep.charCodeAt(i) | 0;
      return 'wp_' + Math.abs(h).toString(36);
    }

    async function registrarWebPush(reg) {
      try {
        if (!('PushManager' in window)) throw new Error('PushManager no disponible en este navegador');
        if (!db) throw new Error('Firebase no inicializado (db=null)');
        
        const existing = await reg.pushManager.getSubscription();
        if (existing) await existing.unsubscribe();
        
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
        
        if (!sub) throw new Error('subscribe() devolvió null');
        
        const j = sub.toJSON();
        if (!j.endpoint || !j.keys || !j.keys.p256dh || !j.keys.auth)
          throw new Error('Suscripción incompleta: faltan keys');
        
        const platform = isIOS() ? 'ios' : isFirefox() ? 'firefox' : 'chromium';
        
        await db.collection('webpush_subscriptions').doc(hashEndpoint(j.endpoint)).set({
          endpoint: j.endpoint, 
          p256dh: j.keys.p256dh, 
          auth: j.keys.auth,
          platform, 
          updatedAt: new Date().toISOString(),
        });
        
        console.log('[WebPush] OK. Platform:', platform, '| endpoint:', j.endpoint.slice(-20));
        return true;
      } catch(e) {
        console.error('[WebPush] Error:', e.message);
        window._lastWebPushError = e.message;
        return false;
      }
    }

    async function renovarRegistros(reg) {
      if (!db) return;
      if ('PushManager' in window) {
        try {
          const sub = await reg.pushManager.getSubscription();
          if (sub) {
            const j = sub.toJSON();
            if (j.endpoint && j.keys && j.keys.p256dh && j.keys.auth) {
              const platform = isIOS() ? 'ios' : isFirefox() ? 'firefox' : 'chromium';
              await db.collection('webpush_subscriptions').doc(hashEndpoint(j.endpoint)).set({
                endpoint: j.endpoint, 
                p256dh: j.keys.p256dh, 
                auth: j.keys.auth,
                platform, 
                updatedAt: new Date().toISOString(),
              });
            }
          }
        } catch(e) { console.warn('[WebPush] Renovación falló:', e.message); }
      }
    }

    async function activarNotificaciones(reg) {
      if (!('Notification' in window)) return false;
      if (Notification.permission !== 'granted') {
        const p = await Notification.requestPermission();
        if (p !== 'granted') return false;
      }
      return await registrarWebPush(reg);
    }

    window._activarNotificaciones = activarNotificaciones;
    window._renovarRegistros      = renovarRegistros;
  </script>

<body class="bg-navy text-white bg-grid min-h-screen">
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
      <div style="color:#c9a84c;font-size:2.5rem">✦</div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;
    const STORAGE_KEY = 'orienteFraterno_v2';

    // ── SVG Icons inline ───────────────────────────────────────────────────────
    const SVG_ICONS = {
      Bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
      BellRing: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="2" y1="8" x2="2.01" y2="8"/><line x1="22" y1="8" x2="22.01" y2="8"/>',
      PlusCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
      Trash2: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>',
    };

    function Icon({ name, size=18, color='currentColor' }) {
      const paths = SVG_ICONS[name] || '';
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{display:'inline-block',verticalAlign:'middle',flexShrink:0}}
          dangerouslySetInnerHTML={{__html: paths}}
        />
      );
    }

    // ── Utilidades ────────────────────────────────────────────────────────
    function loadEvents() {
      try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : []; }
      catch(e) { return []; }
    }
    function saveEventsLocal(l) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); } catch(e) {}
    }
    async function saveEventToFirebase(ev) {
      if (!db) return;
      try { await db.collection('eventos').doc(String(ev.id)).set(ev); } catch(e) {}
    }
    async function deleteEventFromFirebase(ev) {
      if (!db) return;
      try { await db.collection('eventos').doc(ev.docId || String(ev.id)).delete(); } catch(e) {}
    }
    function formatDate(iso) {
      if (!iso) return '';
      const p = String(iso).split('-');
      const M = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      if (p.length === 2) return p[1] + ' ' + (M[+p[0]-1] || '');
      if (p.length === 3) return p[2] + ' ' + (M[+p[1]-1] || '');
      return iso;
    }
    function daysUntil(iso) {
      if (!iso) return 999;
      try {
        const today = new Date(); today.setHours(0,0,0,0);
        const p = String(iso).split('-');
        let m, d;
        if (p.length===2) { m=+p[0]; d=+p[1]; }
        else if (p.length===3) { m=+p[1]; d=+p[2]; }
        else return 999;
        let next = new Date(today.getFullYear(), m-1, d);
        if (isNaN(next.getTime())) return 999;
        if (next < today) next.setFullYear(next.getFullYear()+1);
        return Math.round((next-today)/86400000);
      } catch(e) { return 999; }
    }

    // ── Service Worker ────────────────────────────────────────────────────
    let swReg = null;

    async function registerSW() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        swReg = await navigator.serviceWorker.register('./sw.js', {
          scope: '/', updateViaCache: 'none',
        });
        swReg.addEventListener('updatefound', () => {
          const nw = swReg.installing;
          if (nw) nw.addEventListener('statechange', () => {
            if (nw.state==='installed' && navigator.serviceWorker.controller)
              nw.postMessage({ type:'SKIP_WAITING' });
          });
        });
        await navigator.serviceWorker.ready;
        return swReg;
      } catch(e) { console.error('[App] SW error:', e.message); return null; }
    }
    
    async function syncEventsToSW(events) {
      try {
        const reg = swReg || await navigator.serviceWorker.ready;
        const w = reg.active || reg.waiting || reg.installing;
        if (w) w.postMessage({ type:'SCHEDULE_EVENTS', events });
      } catch(e) {}
    }

    // ── Datos constantes ──────────────────────────────────────────────────
    const TIPOS = [
      { value:'Cumpleaños',               emoji:'🎂' },
      { value:'Fecha de casamiento',      emoji:'💍' },
      { value:'Aniversario',              emoji:'🌹' },
      { value:'Pasaje al Oriente Eterno', emoji:'✦'  },
    ];
    const TIPO_STYLES = {
      'Cumpleaños':               'bg-amber-900/20  border-amber-600/30',
      'Fecha de casamiento':      'bg-purple-900/20 border-purple-500/30',
      'Aniversario':              'bg-rose-900/20   border-rose-600/30',
      'Pasaje al Oriente Eterno': 'bg-slate-800/50  border-slate-500/30',
    };

    // ── Componentes UI ────────────────────────────────────────────────────
    function Toast({ message, visible }) {
      return (
        <div className={'fixed bottom-6 left-1/2 z-50 px-5 py-2.5 rounded-full bg-gradient-to-r from-gold to-gold-light text-navy font-cinzel text-xs tracking-widest uppercase shadow-lg pointer-events-none transition-all duration-300 ' + (visible ? 'opacity-100' : 'opacity-0 translate-y-4')}
          style={{transform:'translateX(-50%)'}}>
          {message}
        </div>
      );
    }
    function Divider({ label }) {
      return (
        <div className="flex items-center gap-3 my-6">
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
          <span className="font-cinzel text-gold text-xs tracking-widest uppercase">{label}</span>
          <div className="flex-1 h-px bg-gradient-to-r from-transparent via-gold/40 to-transparent" />
        </div>
      );
    }
    function Card({ children, className }) {
      return <div className={'rounded-lg border gold-border bg-navy-mid/80 shadow-xl ring-1 ring-gold/5 ' + (className||'')}>{children}</div>;
    }

    // ── Pantalla de bienvenida ────────────────────────────────────────────
    function WelcomeScreen({ onClose }) {
      const ios     = isIOS();
      const android = /Android/i.test(navigator.userAgent);
      const iosVer  = (() => { const m = navigator.userAgent.match(/OS (\d+)_/); return m ? +m[1] : null; })();
      const iosOld  = ios && iosVer !== null && iosVer < 16;
      const [step, setStep] = useState(1);

      return (
        <div className="fixed inset-0 z-50 bg-navy bg-grid flex flex-col items-center justify-center px-6 overflow-y-auto">
          <div className="w-full max-w-sm flex flex-col items-center gap-6 py-8">
            <div className="w-full text-center">
              <div className="text-gold text-5xl mb-3 text-center">✦</div>
              <h1 className="font-cinzel text-gold-light tracking-widest uppercase text-base font-bold text-center">Oriente Fraterno · 148</h1>
              <p className="font-cinzel text-gold/50 tracking-widest uppercase text-xs mt-1 text-center">Configuración de Notificaciones</p>
            </div>

            <Card className="w-full p-5 space-y-5">
              {step === 1 && (
                <div className="fade-in space-y-4">
                  {iosOld && (
                    <div className="bg-red-900/30 border border-red-500/40 rounded p-3">
                      <p className="font-crimson text-red-300 text-sm">⚠️ Tu iOS ({iosVer}) no soporta notificaciones web. Actualiza a iOS 16.4+ para recibirlas.</p>
                    </div>
                  )}
                  {ios && !iosOld && (
                    <div className="bg-amber-900/30 border border-amber-600/40 rounded p-3">
                      <p className="font-crimson text-amber-200 text-sm">📱 En iPhone/iPad debes instalar la app primero y luego activar notificaciones desde adentro.</p>
                    </div>
                  )}
                  <div className="flex gap-3 items-start">
                    <span className="bg-gold/20 text-gold w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">1</span>
                    <p className="font-crimson text-white/90 text-base leading-snug">
                      {ios
                        ? 'Abre esta página en Safari → toca Compartir (□↑) → "Agregar a pantalla de inicio".'
                        : 'Instala la app: toca el menú del navegador y elige "Agregar a pantalla de inicio" o "Instalar aplicación".'}
                    </p>
                  </div>
                  <div className="h-px bg-gold/15" />
                  <div className="flex gap-3 items-start">
                    <span className="bg-gold/20 text-gold w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">2</span>
                    <p className="font-crimson text-white/90 text-base leading-snug">
                      Abre la app instalada y toca <span className="text-gold font-semibold">"Activar Notificaciones Web"</span>, acepta el permiso.
                    </p>
                  </div>
                  <button onClick={() => setStep(2)} className="w-full py-3 mt-2 rounded font-cinzel text-xs tracking-widest uppercase bg-gold/10 border border-gold/30 text-gold font-bold">
                    Siguiente ➔
                  </button>
                </div>
              )}
              {step === 2 && (
                <div className="fade-in space-y-4">
                  <h3 className="font-cinzel text-gold text-xs tracking-widest uppercase text-center">
                    {android ? 'Permitir ejecución en segundo plano' : 'Activar notificaciones en Ajustes'}
                  </h3>
                  {android ? (
                    <div className="space-y-3">
                      <p className="font-crimson text-white/70 text-sm">Para que las notificaciones lleguen con la app cerrada:</p>
                      <ul className="space-y-2 text-sm font-crimson text-white/90">
                        <li className="flex gap-2"><span className="text-gold">1.</span>Mantén presionado el ícono de la app instalada.</li>
                        <li className="flex gap-2"><span className="text-gold">2.</span>Toca <span className="text-gold">Info de la app ⓘ</span>.</li>
                        <li className="flex gap-2"><span className="text-gold">3.</span>Batería → elige <span className="text-gold">Sin restricciones</span>.</li>
                        <li className="flex gap-2"><span className="text-gold">4.</span>En Samsung: también desactiva "Optimización de batería".</li>
                      </ul>
                    </div>
                  ) : ios ? (
                    <div className="space-y-3">
                      <p className="font-crimson text-white/70 text-sm">Una vez instalada la app en pantalla de inicio:</p>
                      <ul className="space-y-2 text-sm font-crimson text-white/90">
                        <li className="flex gap-2"><span className="text-gold">1.</span>Ábrela desde el ícono (no desde Safari).</li>
                        <li className="flex gap-2"><span className="text-gold">2.</span>Activa las notificaciones y acepta el permiso.</li>
                        <li className="flex gap-2"><span className="text-gold">3.</span>Ajustes del iPhone → Notificaciones → <span className="text-gold">Oriente Fraterno</span> → Activa todas.</li>
                      </ul>
                    </div>
                  ) : (
                    <ul className="space-y-2 text-sm font-crimson text-white/90">
                      <li className="flex gap-2"><span className="text-gold">•</span>Instala desde el navegador: menú → "Instalar aplicación".</li>
                      <li className="flex gap-2"><span className="text-gold">•</span>Las notificaciones funcionan aunque el navegador esté cerrado.</li>
                    </ul>
                  )}
                  <div className="h-px bg-gold/15" />
                  <button onClick={onClose} className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold shadow-lg shadow-gold/20">
                    ¡Entendido! ✦
                  </button>
                </div>
              )}
            </Card>
            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
          </div>
        </div>
      );
    }

    // ── App principal ─────────────────────────────────────────────────────
    function App() {
      const [events, setEvents]           = useState(loadEvents);
      const [nombre, setNombre]           = useState('');
      const [mes, setMes]                 = useState('');
      const [dia, setDia]                 = useState('');
      const [tipo, setTipo]               = useState('');
      const [notifOk, setNotifOk]         = useState(
        typeof Notification !== 'undefined' && Notification.permission === 'granted'
      );
      const [toast, setToast]             = useState({ msg:'', visible:false });
      const [loading, setLoading]         = useState(true);
      const [showWelcome, setShowWelcome] = useState(true);
      const toastRef                      = useRef(null);

      // Registrar SW al montar
      useEffect(() => {
        (async () => {
          const reg = await registerSW();
          if (!reg) return;
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            window._renovarRegistros(reg).catch(() => {});
          }
        })();
      }, []);

      // Suscripción Firestore en tiempo real
      useEffect(() => {
        if (!db) { setLoading(false); return; }
        const unsub = db.collection('eventos').onSnapshot(
          snap => {
            const evs = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
            setEvents(evs);
            saveEventsLocal(evs);
            setLoading(false);
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted')
              syncEventsToSW(evs);
          },
          err => { console.error('[App] Firestore error:', err); setLoading(false); }
        );
        return () => unsub();
      }, []);

      const showToast = useCallback((msg) => {
        clearTimeout(toastRef.current);
        setToast({ msg, visible:true });
        toastRef.current = setTimeout(() => setToast(t => ({...t, visible:false})), 2800);
      }, []);

      const sorted = useMemo(() =>
        [...(Array.isArray(events) ? events : [])].sort((a,b) => daysUntil(a.fecha)-daysUntil(b.fecha))
      , [events]);

      async function handleSave() {
        if (!nombre.trim()) { showToast('Ingresa el nombre'); return; }
        if (!mes || !dia)   { showToast('Selecciona mes y día'); return; }
        if (!tipo)          { showToast('Selecciona el tipo de evento'); return; }
        const fecha = mes.padStart(2,'0') + '-' + dia.padStart(2,'0');
        await saveEventToFirebase({ id: Date.now(), nombre: nombre.trim(), fecha, tipo });
        setNombre(''); setMes(''); setDia(''); setTipo('');
        showToast('Evento registrado ✦');
      }

      async function handleDelete(ev) {
        await deleteEventFromFirebase(ev);
        showToast('Evento eliminado');
      }

      async function handleActivar() {
        showToast('Registrando dispositivo...');
        const reg   = swReg || await navigator.serviceWorker.ready.catch(() => null);
        const exito = await window._activarNotificaciones(reg);
        const granted = typeof Notification !== 'undefined' && Notification.permission === 'granted';
        setNotifOk(granted);
        if (exito) {
          await syncEventsToSW(events);
          showToast('Notificaciones activadas ✦');
        } else {
          const err = window._lastWebPushError || '';
          if (!granted) {
            showToast('Permiso denegado. Revisa los ajustes del navegador.');
          } else if (err) {
            showToast('Error: ' + err.slice(0, 60));
          } else {
            showToast('Error al registrar. Abre la consola (F12) e informa el error.');
          }
        }
      }

      if (showWelcome) return <WelcomeScreen onClose={() => setShowWelcome(false)} />;

      if (loading) return (
        <div className="min-h-screen bg-navy bg-grid flex items-center justify-center">
          <div className="text-center">
            <div className="text-gold text-4xl mb-4">✦</div>
            <p className="font-cinzel text-gold/70 text-sm tracking-widest uppercase">Cargando eventos...</p>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-navy bg-grid">
          <header className="sticky top-0 z-40 bg-navy/95 backdrop-blur border-b gold-border">
            <div className="max-w-lg mx-auto px-4 py-3">
              <h1 className="font-cinzel text-gold-light tracking-widest uppercase text-sm font-bold">Registro de Eventos</h1>
              <p className="font-cinzel text-gold/50 tracking-[0.2em] uppercase text-xs mt-0.5">Oriente Fraterno · 148</p>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pb-24">
            <Divider label="Notificaciones" />
            <Card className="p-4">
              <button onClick={handleActivar}
                className={'w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded font-cinzel text-xs tracking-widest uppercase border transition-all ' + (notifOk ? 'border-gold/50 text-gold-light bg-gold/10' : 'border-gold/30 text-gold hover:bg-gold/10')}>
                <Icon name={notifOk ? 'BellRing' : 'Bell'} size={15} />
                {notifOk ? 'Notificaciones Activas ✦' : 'Activar Notificaciones Web'}
              </button>
            </Card>

            <Divider label="Nuevo Registro" />
            <Card className="p-5">
              <div className="space-y-4">
                <div>
                  <label className="block font-cinzel text-gold text-xs tracking-widest uppercase mb-1.5">Nombre</label>
                  <input type="text" value={nombre} onChange={e => setNombre(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSave()} placeholder="Ej: José López"
                    className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base placeholder-white/25 focus:outline-none gold-glow focus:border-gold/70 transition" />
                </div>
                <div className="flex gap-2">
                  <select value={mes} onChange={e => setMes(e.target.value)}
                    className="flex-1 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Mes —</option>
                    {['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((m,i) => (
                      <option key={i+1} value={String(i+1).padStart(2,'0')}>{m}</option>
                    ))}
                  </select>
                  <select value={dia} onChange={e => setDia(e.target.value)}
                    className="w-28 bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                    <option value="">— Día —</option>
                    {Array.from({ length: mes ? [31,29,31,30,31,30,31,31,30,31,30,31][+mes-1] : 31 }, (_,i) => i+1).map(d => (
                      <option key={d} value={String(d).padStart(2,'0')}>{d}</option>
                    ))}
                  </select>
                </div>
                <select value={tipo} onChange={e => setTipo(e.target.value)}
                  className="w-full bg-navy/70 border gold-border rounded px-3 py-2.5 text-white font-crimson text-base focus:outline-none">
                  <option value="">— Seleccionar evento —</option>
                  {TIPOS.map(t => <option key={t.value} value={t.value}>{t.emoji} {t.value}</option>)}
                </select>
                <button onClick={handleSave}
                  className="w-full py-3 rounded font-cinzel text-xs tracking-widest uppercase bg-gradient-to-r from-gold via-gold-light to-gold text-navy font-bold shadow-lg shadow-gold/20 flex items-center justify-center gap-2">
                  <Icon name="PlusCircle" size={15} color="#1e2d4a" /> Registrar Evento
                </button>
              </div>
            </Card>

            <Divider label={'Eventos Registrados (' + sorted.length + ')'} />
            <Card className="p-3">
              {sorted.length === 0
                ? <div className="text-center py-12 text-white/25 italic text-sm">No hay eventos registrados aún.</div>
                : <div className="space-y-2">
                    {sorted.map(ev => {
                      const cfg  = TIPOS.find(t => t.value === ev.tipo) || { emoji:'📌' };
                      const days = daysUntil(ev.fecha);
                      return (
                        <div key={ev.docId || ev.id} className={'flex items-center gap-3 p-3 rounded border ' + (TIPO_STYLES[ev.tipo] || 'bg-navy/50 border-white/10')}>
                          <div className="w-10 h-10 rounded-full border border-gold/20 flex items-center justify-center text-lg bg-black/20 shrink-0">{cfg.emoji}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-cinzel text-white text-sm font-semibold truncate">{ev.nombre}</p>
                            <p className="text-gold text-xs uppercase">{ev.tipo} · {formatDate(ev.fecha)}</p>
                            <p className="text-white/40 text-xs">{days === 0 ? 'HOY ✦' : 'En ' + days + ' días'}</p>
                          </div>
                          <button onClick={() => handleDelete(ev)} className="p-1.5 text-red-500/60 hover:text-red-400 shrink-0">
                            <Icon name="Trash2" size={14} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
              }
            </Card>
          </main>

          <footer className="text-center pb-8 pt-2">
            <p className="font-cinzel text-gold/25 text-xs tracking-[0.2em] uppercase">✦ A L:. G:. A:. D:. U:. ✦</p>
            <p className="font-cinzel text-gold/20 text-xs tracking-widest uppercase mt-2">Creación: H.'. C. E. A. D. 2026</p>
          </
