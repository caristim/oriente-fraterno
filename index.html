<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oriente Fraterno 148</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/oriente-fraterno/manifest.json">
  <link rel="icon" href="/oriente-fraterno/assets/icon-192.png" sizes="192x192">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 1rem; background:#fff; color:#111; }
    .switch { display:flex; align-items:center; gap:.5rem; }
  </style>
</head>
<body>
  <h1>Oriente Fraterno 148</h1>
  <p>Bienvenido. Usa el interruptor para activar o desactivar notificaciones.</p>

  <div class="switch">
    <label for="notif-toggle">Notificaciones</label>
    <input type="checkbox" id="notif-toggle" aria-label="Activar notificaciones">
    <span id="notif-status" style="margin-left:1rem;color:#666"></span>
  </div>

  <script src="/oriente-fraterno/main.js" defer></script>
</body>
</html>
