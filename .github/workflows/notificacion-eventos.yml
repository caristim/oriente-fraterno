const now = Date.now();
    const message = {
      message: {
        token,
        data: {
          title: 'Oriente Fraterno 148',
          body: textoNotificacion,
          click_action: './'
        },
        android: {
          priority: 'high',
          notification: {
            sound: 'default',
            channel_id: 'default'
          }
        },
        apns: {
          headers: {
            'apns-priority': '10'
          },
          payload: {
            aps: {
              sound: 'default',
              badge: 1,
              contentAvailable: true
            }
          }
        },
        webpush: {
          headers: {
            Urgency: 'high'
          }
        }
      }
    };

    const ok = await sendFCM(projectId, accessToken, message);

    if (!ok.success) {
      const err = String(ok.error || '');

      const invalid =
        err.includes('UNREGISTERED') ||
        err.includes('registration-token-not-registered') ||
        err.includes('Requested entity was not found') ||
        err.includes('INVALID_ARGUMENT') ||
        err.includes('Invalid registration token') ||
        err.includes('MismatchSenderId');

      if (invalid) {
        console.log('Eliminando token invalido:', token.substring(0, 20));
        await firestoreDelete(accessToken, tokenDoc.name);
      } else {
        console.warn('Error FCM temporal:', err);
      }
    } else {
      console.log('Push enviado OK');
    }

  } catch (err) {
    console.warn('Error procesando token:', err);
  }
}
