name: Notificacion Eventos 9AM UY

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 09:00 Uruguay. Sin horario de verano
  workflow_dispatch:        # Permite ejecutar manual para probar

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar eventos de hoy y notificar via FCM
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node << 'EOF'
          const https = require('https');
          const crypto = require('crypto');

          const PROJECT_ID = process.env.FIREBASE_PROJECT_ID;
          const SA = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          // ── 1. Helper: Base64URL para JWT ────────────────────────────
          function base64url(str) {
            return Buffer.from(str).toString('base64')
             .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
          }

          // ── 2. Obtener token OAuth de Google con scope FCM + Firestore ─
          function getGoogleToken() {
            return new Promise((resolve, reject) => {
              const now = Math.floor(Date.now() / 1000);
              const header = { alg: 'RS256', typ: 'JWT' };
              const payload = {
                iss: SA.client_email,
                scope: 'https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/datastore',
                aud: 'https://oauth2.googleapis.com/token',
                iat: now,
                exp: now + 3600
              };
              const data = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
              const sign = crypto.createSign('RSA-SHA256');
              sign.update(data);
              const signature = sign.sign(SA.private_key, 'base64')
               .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
              const jwt = `${data}.${signature}`;
              
              const body = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`;
              
              const req = https.request({
                hostname: 'oauth2.googleapis.com',
                path: '/token',
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  const p = JSON.parse(d);
                  p.access_token? resolve(p.access_token) : reject(new Error('Token error: ' + d));
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // ── 3. Leer colección completa de Firestore con paginación ────
          async function firestoreGetAll(collection, accessToken) {
            let allDocs = [];
            let pageToken = null;
            
            do {
              const path = `/v1/projects/${PROJECT_ID}/databases/(default)/documents/${collection}?pageSize=300${pageToken? `&pageToken=${pageToken}` : ''}`;
              
              const data = await new Promise((resolve, reject) => {
                https.get({
                  hostname: 'firestore.googleapis.com',
                  path,
                  headers: { 'Authorization': `Bearer ${accessToken}` }
                }, (res) => {
                  let d = '';
                  res.on('data', c => d += c);
                  res.on('end', () => { 
                    try { resolve(JSON.parse(d)); } 
                    catch(e) { reject(e); } 
                  });
                }).on('error', reject);
              });
              
              if (data.error) throw new Error(`Firestore error: ${JSON.stringify(data.error)}`);
              if (data.documents) allDocs = allDocs.concat(data.documents);
              pageToken = data.nextPageToken || null;
              
            } while (pageToken);
            
            return allDocs;
          }

          // ── 4. Enviar FCM a un token específico ───────────────────────
          function sendFCM(token, title, body, accessToken) {
            return new Promise((resolve, reject) => {
              const message = {
                message: {
                  token: token,
                  data: { // data-only para que siempre lo capture sw.js
                    title: title,
                    body: body,
                    url: 'https://caristim.github.io/oriente-fraterno/',
                    icon: './icon-192.png',
                    badge: './icon-192.png',
                    image: './icon-512.png'
                  },
                  android: {
                    priority: 'HIGH'
                  },
                  apns: {
                    headers: { 'apns-priority': '10' },
                    payload: {
                      aps: { sound: 'default' }
                    }
                  },
                  webpush: {
                    headers: { Urgency: 'high' }
                  }
                }
              };
              
              const req = https.request({
                hostname: 'fcm.googleapis.com',
                path: `/v1/projects/${PROJECT_ID}/messages:send`,
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${accessToken}`,
                  'Content-Type': 'application/json'
                }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    resolve({ success: true, token });
                  } else {
                    resolve({ success: false, token, error: d });
                  }
                });
              });
              req.on('error', err => resolve({ success: false, token, error: err.message }));
              req.write(JSON.stringify(message));
              req.end();
            });
          }

          // ── 5. Helper: Parsear campos de Firestore ────────────────────
          function parseFirestoreValue(field) {
            if (!field) return null;
            if (field.stringValue !== undefined) return field.stringValue;
            if (field.integerValue !== undefined) return parseInt(field.integerValue);
            if (field.doubleValue !== undefined) return parseFloat(field.doubleValue);
            if (field.booleanValue !== undefined) return field.booleanValue;
            if (field.timestampValue !== undefined) return new Date(field.timestampValue);
            return null;
          }

          function parseFirestoreDoc(doc) {
            const data = {};
            if (doc.fields) {
              for (const key in doc.fields) {
                data[key] = parseFirestoreValue(doc.fields[key]);
              }
            }
            data.docId = doc.name.split('/').pop();
            return data;
          }

          // ── 6. MAIN: Ejecutar lógica ─────────────────────────────────
          async function main() {
            console.log('[CRON] Iniciando verificación de eventos...');
            
            try {
              const accessToken = await getGoogleToken();
              console.log('[CRON] Token OAuth obtenido');
              
              // 6.1 Leer todos los eventos
              const eventDocs = await firestoreGetAll('eventos', accessToken);
              const eventos = eventDocs.map(parseFirestoreDoc);
              console.log(`[CRON] ${eventos.length} eventos totales en Firestore`);
              
              // 6.2 Filtrar eventos de HOY en horario Uruguay
              const now = new Date();
              const hoyUY = new Date(now.toLocaleString('en-US', { timeZone: 'America/Montevideo' }));
              const mesHoy = hoyUY.getMonth() + 1; // 1-12
              const diaHoy = hoyUY.getDate(); // 1-31
              
              const eventosHoy = eventos.filter(ev => {
                if (!ev.fecha) return false;
                // Soporta formato MM-DD o YYYY-MM-DD
                const parts = String(ev.fecha).split('-').map(Number);
                let mes, dia;
                if (parts.length === 2) [mes, dia] = parts;
                else if (parts.length === 3) [, mes, dia] = parts;
                else return false;
                return mes === mesHoy && dia === diaHoy;
              });
              
              console.log(`[CRON] Eventos hoy ${mesHoy}-${diaHoy}: ${eventosHoy.length}`);
              
              if (eventosHoy.length === 0) {
                console.log('[CRON] No hay eventos hoy. No se envía notificación.');
                return;
              }
              
              // 6.3 Armar mensaje de notificación
              const titulo = eventosHoy.length === 1 
               ? `Hoy: ${eventosHoy[0].nombre}`
                : `${eventosHoy.length} eventos hoy`;
              
              const cuerpo = eventosHoy.length === 1
               ? `${eventosHoy[0].tipo || 'Evento'} - Oriente Fraterno 148`
                : eventosHoy.map(e => `• ${e.nombre}`).join('\n');
              
              console.log(`[CRON] Título: ${titulo}`);
              console.log(`[CRON] Cuerpo: ${cuerpo}`);
              
              // 6.4 Leer todos los tokens FCM
              const tokenDocs = await firestoreGetAll('fcm_tokens', accessToken);
              const tokens = tokenDocs.map(parseFirestoreDoc)
               .map(t => t.token)
               .filter(Boolean);
              
              console.log(`[CRON] ${tokens.length} tokens FCM encontrados`);
              
              if (tokens.length === 0) {
                console.log('[CRON] No hay tokens registrados. Nadie recibirá push.');
                return;
              }
              
              // 6.5 Enviar FCM a todos los tokens en paralelo
              const resultados = await Promise.all(
                tokens.map(token => sendFCM(token, titulo, cuerpo, accessToken))
              );
              
              const exitosos = resultados.filter(r => r.success).length;
              const fallidos = resultados.filter(r =>!r.success).length;
              
              console.log(`[CRON] Enviados: ${exitosos} OK, ${fallidos} fallidos`);
              
              // Log tokens inválidos para limpiar después
              resultados.filter(r =>!r.success).forEach(r => {
                console.log(`[CRON] Token fallido: ${r.token.substring(0,20)}... Error: ${r.error}`);
              });
              
              console.log('[CRON] Proceso completado.');
              
            } catch (err) {
              console.error('[CRON] Error fatal:', err);
              process.exit(1);
            }
          }

          main();
          EOF
