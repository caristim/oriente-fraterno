name: Notificacion Eventos 9AM

on:
  schedule:
    # 09:00 UYT = 12:00 UTC (Uruguay UTC-3 todo el año)
    - cron: '0 12 * * *'
  workflow_dispatch:   # Permite ejecución manual

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Montevideo   # Forzar zona horaria para todo el job

    steps:
      - name: Instalar dependencias
        run: npm install web-push

      - name: Verificar eventos y notificar
        env:
          FIREBASE_PROJECT_ID:      ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY:         ${{ secrets.OF_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:        ${{ secrets.OF_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:            ${{ secrets.OF_VAPID_SUBJECT }}
        run: |
          node << 'EOF'
          'use strict';
          const https   = require('https');
          const crypto  = require('crypto');
          const webpush = require('web-push');

          // ── Validación exhaustiva de variables ──────────────────────────────
          const required = [
            'FIREBASE_PROJECT_ID', 'FIREBASE_SERVICE_ACCOUNT',
            'VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY', 'VAPID_SUBJECT'
          ];
          for (const v of required) {
            if (!process.env[v]) {
              console.error(`❌ Variable faltante: ${v}`);
              process.exit(1);
            }
          }

          // Validar que FIREBASE_SERVICE_ACCOUNT sea un JSON válido
          let sa;
          try {
            sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            if (!sa.client_email || !sa.private_key) {
              console.error('❌ FIREBASE_SERVICE_ACCOUNT no contiene client_email o private_key');
              process.exit(1);
            }
          } catch (e) {
            console.error('❌ FIREBASE_SERVICE_ACCOUNT no es un JSON válido:', e.message);
            process.exit(1);
          }

          // Configurar VAPID para Web Push nativo
          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT,
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          console.log('VAPID configurado ✓');
          console.log('Subject:', process.env.VAPID_SUBJECT);
          console.log('Public key (primeros 20):', process.env.VAPID_PUBLIC_KEY.substring(0, 20) + '...');

          // ── Helpers JWT y Firestore REST (sin cambios) ─────────────────────
          function base64url(str) { /* ... */ }
          function getGoogleToken(sa) { /* ... */ }
          async function firestoreGetPage(projectId, accessToken, collection, pageToken) { /* ... */ }
          async function firestoreGetAll(projectId, accessToken, collection) { /* ... */ }
          async function firestoreDelete(accessToken, docName) { /* ... */ }

          // ── Envío FCM mejorado ─────────────────────────────────────────────
          async function fcmSend(projectId, accessToken, token, titulo, cuerpo, tag) {
            const appUrl = 'https://caristim.github.io/oriente-fraterno/';
            const icon   = appUrl + 'icon-192.png';
            const payload = {
              message: {
                token: token,
                notification: {
                  title: titulo,
                  body:  cuerpo,
                },
                data: {
                  title: titulo,
                  body:  cuerpo,
                  url:   appUrl,
                  tag:   tag,
                },
                android: {
                  priority: 'high',
                  ttl:      '86400s',
                  notification: {
                    channel_id: 'of-eventos',
                    priority:   'HIGH',
                  },
                },
                webpush: {
                  headers: {
                    Urgency: 'high',
                    TTL:     '86400',
                  },
                  notification: {
                    title:              titulo,
                    body:               cuerpo,
                    icon:               icon,
                    badge:              icon,
                    tag:                tag,
                    requireInteraction: true,
                  },
                  fcm_options: {
                    link: appUrl,
                  },
                },
              },
            };

            return new Promise((resolve) => {
              const req = https.request({
                hostname: 'fcm.googleapis.com',
                path:     `/v1/projects/${projectId}/messages:send`,
                method:   'POST',
                headers:  {
                  'Content-Type':  'application/json',
                  'Authorization': `Bearer ${accessToken}`,
                },
              }, res => {
                let r = '';
                res.on('data', c => r += c);
                res.on('end', () => {
                  let parsed = {};
                  try { parsed = JSON.parse(r); } catch(_) {}
                  if (parsed.error) {
                    const details = parsed.error.details || [];
                    const fcmErr  = details.find(d => d.errorCode);
                    const code    = fcmErr ? fcmErr.errorCode : (parsed.error.status || 'UNKNOWN');
                    const invalid = ['UNREGISTERED', 'INVALID_ARGUMENT', 'SENDER_ID_MISMATCH'].includes(code);
                    console.log(`  FCM [${code}]: ${token.substring(0, 24)}... → ${invalid ? 'INVÁLIDO (se eliminará)' : 'error temporal'}`);
                    resolve({ invalid });
                  } else {
                    console.log(`  FCM ✓ OK: ${token.substring(0, 24)}...`);
                    resolve({ invalid: false });
                  }
                });
              });
              req.on('error', e => {
                console.warn('  FCM error de red:', e.message);
                resolve({ invalid: false });
              });
              req.write(JSON.stringify(payload));
              req.end();
            });
          }

          // ── Web Push nativo (sin cambios) ─────────────────────────────────
          async function webPushSend(subscription, titulo, cuerpo, tag) { /* ... */ }

          // ── MAIN ─────────────────────────────────────────────────────────────
          async function main() {
            const ahora     = new Date();
            const formatter = new Intl.DateTimeFormat('es-UY', {
              timeZone: 'America/Montevideo',
              year: 'numeric', month: '2-digit', day: '2-digit',
            });
            const partes    = formatter.format(ahora).split('/');
            const dia       = partes[1];
            const mes       = partes[0];
            const fechaHoy  = mes + '-' + dia;  // MM-DD
            const projectId = process.env.FIREBASE_PROJECT_ID;

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('Oriente Fraterno 148 — Notificador de Eventos');
            console.log('Hora UTC:         ', ahora.toISOString());
            console.log('Hora Uruguay:     ', ahora.toLocaleString('es-UY', { timeZone: 'America/Montevideo' }));
            console.log('Fecha Uruguay:    ', fechaHoy, '(MM-DD)');
            console.log('Firebase Project: ', projectId);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            // Obtener token OAuth2
            let accessToken;
            try {
              accessToken = await getGoogleToken(sa);
              console.log('Token OAuth2: ✓ OK');
            } catch (e) {
              console.error('❌ Error obteniendo token OAuth2:', e.message);
              process.exit(1);
            }

            // [1] Leer eventos
            console.log('\n[1/4] Leyendo eventos de Firestore...');
            const eventosData = await firestoreGetAll(projectId, accessToken, 'eventos');
            if (eventosData.error) {
              console.error('❌ Error crítico leyendo eventos:', JSON.stringify(eventosData.error));
              process.exit(1);
            }
            const todosLosEventos = (eventosData.documents || []).map(doc => {
              const f = doc.fields || {};
              return {
                nombre: (f.nombre?.stringValue) || '',
                fecha:  (f.fecha?.stringValue)  || '',
                tipo:   (f.tipo?.stringValue)   || '',
              };
            }).filter(e => e.nombre && e.fecha && e.tipo);

            console.log(`  Total eventos en Firestore: ${todosLosEventos.length}`);
            const eventos = todosLosEventos.filter(e => e.fecha === fechaHoy);

            if (eventos.length === 0) {
              console.log(`\nHoy (${fechaHoy}) no hay eventos. No se envían notificaciones.`);
              // Mostrar próximos eventos (opcional)
              console.log('\nPróximos eventos en 7 días:');
              const hoy = new Date();
              for (let i = 1; i <= 7; i++) {
                const d = new Date(hoy); d.setDate(d.getDate() + i);
                const dm = String(d.getMonth()+1).padStart(2,'0');
                const dd = String(d.getDate()).padStart(2,'0');
                const f = dm + '-' + dd;
                const evs = todosLosEventos.filter(e => e.fecha === f);
                if (evs.length) console.log(`  ${i} día(s) (${f}): ${evs.map(e=>e.nombre).join(', ')}`);
              }
              console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              return;
            }

            console.log(`  Eventos para hoy: ${eventos.map(e => `${e.nombre} (${e.tipo})`).join(', ')}`);

            // [2] Leer tokens FCM
            console.log('\n[2/4] Leyendo tokens FCM (Chrome/Edge/Android)...');
            const fcmData = await firestoreGetAll(projectId, accessToken, 'fcm_tokens');
            const fcmDocs = (fcmData.error ? [] : (fcmData.documents || [])).map(doc => ({
              token:   (doc.fields?.token?.stringValue) || '',
              docName: doc.name,
            })).filter(d => d.token.length > 10);
            console.log(`  Tokens FCM registrados: ${fcmDocs.length}`);

            // [3] Leer suscripciones Web Push
            console.log('\n[3/4] Leyendo suscripciones Web Push (iOS/Firefox)...');
            const wpData = await firestoreGetAll(projectId, accessToken, 'webpush_subscriptions');
            const wpDocs = (wpData.error ? [] : (wpData.documents || [])).map(doc => {
              const f = doc.fields || {};
              return {
                endpoint: (f.endpoint?.stringValue) || '',
                p256dh:   (f.p256dh?.stringValue)   || '',
                auth:     (f.auth?.stringValue)     || '',
                platform: (f.platform?.stringValue) || 'unknown',
                docName:  doc.name,
              };
            }).filter(d => d.endpoint && d.p256dh && d.auth && d.platform !== 'chromium');
            console.log(`  Suscripciones Web Push (iOS/Firefox): ${wpDocs.length}`);

            if (fcmDocs.length === 0 && wpDocs.length === 0) {
              console.log('\n⚠️  No hay dispositivos registrados.');
              console.log('   Los usuarios deben abrir la app y pulsar "Activar Notificaciones Web".');
              console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              return;
            }

            // [4] Enviar notificaciones
            console.log('\n[4/4] Enviando notificaciones...');
            const fcmInvalidos = new Set();
            const wpInvalidos  = new Set();

            for (const ev of eventos) {
              const titulo = 'Oriente Fraterno 148';
              const cuerpo = `Hoy: ${ev.tipo} de ${ev.nombre}`;
              const tag    = 'of-ev-' + ev.nombre
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-').toLowerCase().substring(0, 30) + '-' + fechaHoy;

              console.log(`\n  ✦ Evento: ${cuerpo}`);
              console.log(`  Tag: ${tag}`);

              // FCM
              if (fcmDocs.length > 0) {
                console.log(`  Enviando FCM a ${fcmDocs.length} dispositivo(s)...`);
                for (const td of fcmDocs) {
                  const r = await fcmSend(projectId, accessToken, td.token, titulo, cuerpo, tag);
                  if (r.invalid) fcmInvalidos.add(td.docName);
                }
              }

              // Web Push
              if (wpDocs.length > 0) {
                console.log(`  Enviando Web Push a ${wpDocs.length} suscripción(es)...`);
                for (const sub of wpDocs) {
                  const subscription = {
                    endpoint: sub.endpoint,
                    keys:     { p256dh: sub.p256dh, auth: sub.auth },
                  };
                  const r = await webPushSend(subscription, titulo, cuerpo, tag);
                  if (r.invalid) wpInvalidos.add(sub.docName);
                }
              }
            }

            // Limpieza de tokens inválidos
            if (fcmInvalidos.size) {
              console.log(`\nLimpiando ${fcmInvalidos.size} token(s) FCM inválido(s)...`);
              for (const dn of fcmInvalidos) await firestoreDelete(accessToken, dn);
            }
            if (wpInvalidos.size) {
              console.log(`\nLimpiando ${wpInvalidos.size} suscripción(es) Web Push inválida(s)...`);
              for (const dn of wpInvalidos) await firestoreDelete(accessToken, dn);
            }

            console.log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('✅ Proceso completado.');
            console.log(`   FCM enviados:     ${fcmDocs.length - fcmInvalidos.size} / ${fcmDocs.length}`);
            console.log(`   WebPush enviados: ${wpDocs.length - wpInvalidos.size}  / ${wpDocs.length}`);
            console.log(`   Tokens eliminados: FCM=${fcmInvalidos.size}, WP=${wpInvalidos.size}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
          }

          main().catch(e => {
            console.error('\n❌ Error fatal:', e.message);
            console.error(e.stack);
            process.exit(1);
          });
          EOF
