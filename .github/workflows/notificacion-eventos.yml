name: Notificacion Eventos 9AM

'on':
  schedule:
    - cron: '0 12 * * *'   # 09:00 Uruguay (UTC-3, sin horario de verano desde 2015)
  workflow_dispatch:         # Permite ejecutar manualmente para probar

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar eventos y notificar
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node << 'EOF'
          const https  = require('https');
          const crypto = require('crypto');

          function base64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
          }

          function getGoogleToken(sa) {
            return new Promise((resolve, reject) => {
              const now = Math.floor(Date.now() / 1000);
              const header  = { alg: 'RS256', typ: 'JWT' };
              const payload = {
                iss:   sa.client_email,
                scope: 'https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/datastore',
                aud:   'https://oauth2.googleapis.com/token',
                iat:   now,
                exp:   now + 3600
              };
              const data = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
              const sign = crypto.createSign('RSA-SHA256');
              sign.update(data);
              const jwt = data + '.' + sign.sign(sa.private_key, 'base64')
                .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
              const body = 'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=' + jwt;
              const req = https.request({
                hostname: 'oauth2.googleapis.com',
                path: '/token',
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  const p = JSON.parse(d);
                  p.access_token ? resolve(p.access_token) : reject(new Error('Token error: ' + d));
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function firestoreGetPage(projectId, accessToken, collection, pageToken) {
            return new Promise((resolve, reject) => {
              let path = '/v1/projects/' + projectId + '/databases/(default)/documents/' + collection + '?pageSize=300';
              if (pageToken) path += '&pageToken=' + encodeURIComponent(pageToken);
              https.get({
                hostname: 'firestore.googleapis.com',
                path,
                headers: { 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function firestoreGetAll(projectId, accessToken, collection) {
            let allDocuments = [];
            let pageToken = null;
            do {
              const data = await firestoreGetPage(projectId, accessToken, collection, pageToken);
              if (data.error) return data;
              allDocuments = allDocuments.concat(data.documents || []);
              pageToken = data.nextPageToken || null;
            } while (pageToken);
            return { documents: allDocuments };
          }

          function firestoreDelete(accessToken, docName) {
            return new Promise((resolve) => {
              const path = '/v1/' + docName;
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path,
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  console.log('Token invalido eliminado de Firestore (status ' + res.statusCode + ')');
                  resolve();
                });
              });
              req.on('error', (e) => { console.warn('Error eliminando token: ' + e.message); resolve(); });
              req.end();
            });
          }

          // CORRECCIÓN: se agrega webpush.notification al payload.
          //
          // Por qué es necesario para iOS:
          //   Los tokens FCM generados por el browser (getToken() en la PWA) son tokens
          //   web push, no tokens APNS nativos. Para estos tokens, FCM usa el protocolo
          //   Web Push (RFC 8030) y solo procesa el bloque "webpush" del payload.
          //   El bloque "apns" es ignorado completamente para tokens web.
          //
          //   En iOS Safari PWA (16.4+), Apple implementó Web Push con su propio stack
          //   WebKit. Cuando el payload incluye webpush.notification, FCM entrega la
          //   notificación a través del protocolo Web Push estándar y WebKit la muestra
          //   directamente, SIN necesitar que el firebase-messaging-compat SW se ejecute.
          //   Esto es lo que garantiza que llegue la notificación con la app cerrada en iOS.
          //
          // Por qué no causa duplicados en Android:
          //   El SW (onBackgroundMessage) detecta el campo notification en el payload
          //   y NO llama a showNotification() — solo ejecuta markFcmFiredToday().
          //   La notificación la muestra FCM/Chrome automáticamente desde webpush.notification.
          //
          // El bloque "apns" del payload original fue eliminado porque era ignorado
          // para tokens web push (solo aplica a tokens del SDK nativo Swift/ObjC).
          //
          function fcmSend(projectId, accessToken, token, titulo, cuerpo) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                message: {
                  token,
                  // Campo data: leído por onBackgroundMessage en el SW para markFcmFiredToday
                  data: {
                    title: titulo,
                    body:  cuerpo,
                  },
                  android: {
                    priority: 'high'
                  },
                  // webpush.notification: garantiza la entrega en iOS PWA y Chrome/Android
                  // sin depender de que el SW ejecute showNotification().
                  webpush: {
                    headers: {
                      Urgency: 'high'
                    },
                    notification: {
                      title: titulo,
                      body:  cuerpo,
                      icon:  'https://caristim.github.io/oriente-fraterno/icon-192.png',
                      badge: 'https://caristim.github.io/oriente-fraterno/icon-192.png',
                      requireInteraction: true,
                      vibrate: [200, 100, 200, 100, 200],
                      data: {
                        url: 'https://caristim.github.io/oriente-fraterno/'
                      }
                    },
                    fcm_options: { link: 'https://caristim.github.io/oriente-fraterno/' }
                  }
                }
              });
              const req = https.request({
                hostname: 'fcm.googleapis.com',
                path:     '/v1/projects/' + projectId + '/messages:send',
                method:   'POST',
                headers:  { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let r = '';
                res.on('data', c => r += c);
                res.on('end', () => {
                  let parsed = {};
                  try { parsed = JSON.parse(r); } catch(_) {}

                  if (parsed.error) {
                    const details = parsed.error.details || [];
                    const fcmError = details.find(d => d.errorCode);
                    const errorCode = fcmError ? fcmError.errorCode : parsed.error.status;
                    const isInvalidToken = ['UNREGISTERED', 'INVALID_ARGUMENT'].includes(errorCode);
                    console.log('FCM error [' + errorCode + '] token: ' + token.substring(0, 20) + '...');
                    resolve({ invalid: isInvalidToken });
                  } else {
                    console.log('FCM OK: ' + token.substring(0, 20) + '...');
                    resolve({ invalid: false });
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const ahora     = new Date();
            // Uruguay: UTC-3 todo el año (sin horario de verano desde 2015)
            const localTime = new Date(ahora.getTime() + (-3 * 60 * 60000));
            const dia       = String(localTime.getUTCDate()).padStart(2,'0');
            const mes       = String(localTime.getUTCMonth() + 1).padStart(2,'0');
            const fechaHoy  = mes + '-' + dia;
            const projectId = process.env.FIREBASE_PROJECT_ID;

            console.log('Fecha Uruguay: ' + fechaHoy);

            const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const accessToken = await getGoogleToken(sa);
            console.log('Token Google OK');

            // 1. Eventos de hoy
            const eventosData = await firestoreGetAll(projectId, accessToken, 'eventos');
            if (eventosData.error) {
              console.error('Error leyendo eventos:', JSON.stringify(eventosData.error));
              process.exit(1);
            }
            const eventos = (eventosData.documents || []).map(doc => {
              const f = doc.fields || {};
              return {
                nombre: (f.nombre && f.nombre.stringValue) || '',
                fecha:  (f.fecha  && f.fecha.stringValue)  || '',
                tipo:   (f.tipo   && f.tipo.stringValue)   || ''
              };
            }).filter(e => e.fecha === fechaHoy);

            if (eventos.length === 0) { console.log('Hoy no hay eventos.'); return; }
            console.log('Eventos hoy: ' + eventos.map(e => e.nombre).join(', '));

            // 2. Tokens FCM
            const tokensData = await firestoreGetAll(projectId, accessToken, 'fcm_tokens');
            if (tokensData.error) {
              console.error('Error leyendo tokens:', JSON.stringify(tokensData.error));
              process.exit(1);
            }
            const tokenDocs = (tokensData.documents || []).map(doc => ({
              token:   (doc.fields && doc.fields.token && doc.fields.token.stringValue) || '',
              docName: doc.name
            })).filter(d => d.token.length > 0);

            if (tokenDocs.length === 0) { console.log('No hay tokens FCM registrados.'); return; }
            console.log('Tokens registrados: ' + tokenDocs.length);

            // 3. Enviar notificaciones
            const tokenesInvalidos = new Set();

            for (const ev of eventos) {
              const msg = 'Hoy: ' + ev.tipo + ' de ' + ev.nombre;
              console.log('Enviando: ' + msg);
              for (const td of tokenDocs) {
                const result = await fcmSend(projectId, accessToken, td.token, 'Oriente Fraterno 148', msg);
                if (result.invalid) {
                  tokenesInvalidos.add(td.docName);
                }
              }
            }

            // 4. Limpiar tokens inválidos
            if (tokenesInvalidos.size > 0) {
              console.log('Limpiando ' + tokenesInvalidos.size + ' token(s) invalido(s)...');
              for (const docName of tokenesInvalidos) {
                await firestoreDelete(accessToken, docName);
              }
            }

            console.log('Proceso completado.');
          }

          main().catch(e => { console.error('Error: ' + e.message); process.exit(1); });
          EOF
