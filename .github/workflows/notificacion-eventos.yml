name: Notificacion Eventos 9AM

on:
  schedule:
    # Uruguay es UTC-3 TODO EL AÑO. 09:00 UYT = 12:00 UTC.
    # v26: NUNCA usar el minuto 0: GitHub descarta o retrasa muchísimo los
    # cron de ':00' por sobrecarga. Se usan 3 disparos escalonados; el
    # script deduplica (Firestore: notificaciones_enviadas/AAAA-MM-DD) y
    # solo el primero que funcione envía.
    - cron: '17 12 * * *'   # 09:17 Uruguay (principal)
    - cron: '47 12 * * *'   # 09:47 Uruguay (respaldo 1)
    - cron: '23 13 * * *'   # 10:23 Uruguay (respaldo 2)
    - cron: '11 6 * * 1'    # lunes: mantiene el workflow activo (keepalive)
  workflow_dispatch:         # Ejecución manual para pruebas

permissions:
  contents: read
  actions: write             # necesario para el keepalive

jobs:
  # ── KEEPALIVE ────────────────────────────────────────────────────────
  # GitHub DESACTIVA automáticamente los workflows programados de un
  # repositorio público tras 60 días sin actividad (commits, etc.).
  # Esa es la causa más probable de "dejó de notificar de golpe".
  # Re-habilitar el workflow vía API reinicia ese contador de 60 días.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reiniciar contador de inactividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notificacion-eventos.yml/enable" \
            && echo "Workflow re-habilitado (contador de 60 días reiniciado)" \
            || echo "No se pudo re-habilitar (no es fatal)"

  enviar-notificacion:
    # El cron del lunes 06:11 UTC es solo keepalive: no debe enviar nada.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '11 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar dependencias
        run: npm install web-push

      - name: Verificar eventos y notificar
        env:
          FIREBASE_PROJECT_ID:      ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY:         ${{ secrets.OF_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:        ${{ secrets.OF_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:            ${{ secrets.OF_VAPID_SUBJECT }}
          GH_EVENT_NAME:            ${{ github.event_name }}
        run: |
          node << 'EOF'
          'use strict';
          // ════════════════════════════════════════════════════════════════
          // Oriente Fraterno 148 — Notificador de Eventos (v25.0)
          // CORRECCIÓN v25.0: se elimina por completo el envío vía Firebase
          // Cloud Messaging (FCM). Ese mecanismo requería un Service Worker
          // especial ("firebase-messaging-sw.js") que nunca existió en el
          // proyecto, y por eso las notificaciones jamás llegaban con la app
          // cerrada en Android/Chrome/Edge (solo con la app abierta).
          // Ahora TODO se envía vía WebPush nativo + VAPID, exactamente igual
          // que en la app Cumples-Familia, que sí notifica con la app cerrada
          // en Android, Windows/Edge e iOS. Firestore se sigue usando como
          // base de datos (vía REST + OAuth2), solo cambió el canal de envío.
          // ════════════════════════════════════════════════════════════════
          const https   = require('https');
          const crypto  = require('crypto');
          const webpush = require('web-push');

          // ── Validar variables de entorno ────────────────────────────────────
          const requiredEnvVars = [
            'FIREBASE_PROJECT_ID',
            'FIREBASE_SERVICE_ACCOUNT',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
            'VAPID_SUBJECT',
          ];
          for (const v of requiredEnvVars) {
            if (!process.env[v]) {
              console.error(`❌ Variable de entorno faltante: ${v}`);
              console.error('   Verifica los Secrets en Settings → Secrets and variables → Actions.');
              process.exit(1);
            }
          }

          // ── Configurar VAPID para Web Push nativo ──────────────────────────
          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT,
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          const ES_MANUAL = process.env.GH_EVENT_NAME === 'workflow_dispatch';

          // ── Helpers JWT para Google OAuth2 (necesario para leer/escribir Firestore) ──
          function base64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
          }

          function getGoogleToken(sa) {
            return new Promise((resolve, reject) => {
              const now     = Math.floor(Date.now() / 1000);
              const header  = { alg: 'RS256', typ: 'JWT' };
              const payload = {
                iss:   sa.client_email,
                scope: 'https://www.googleapis.com/auth/datastore',
                aud:   'https://oauth2.googleapis.com/token',
                iat:   now,
                exp:   now + 3600,
              };
              const sigInput = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
              const sign     = crypto.createSign('RSA-SHA256');
              sign.update(sigInput);
              const jwt  = sigInput + '.' + sign.sign(sa.private_key, 'base64')
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
              const body = 'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=' + jwt;

              const req = https.request({
                hostname: 'oauth2.googleapis.com',
                path:     '/token',
                method:   'POST',
                headers:  { 'Content-Type': 'application/x-www-form-urlencoded' },
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  try {
                    const p = JSON.parse(d);
                    if (p.access_token) resolve(p.access_token);
                    else reject(new Error('OAuth2 error: ' + d));
                  } catch(e) { reject(e); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // ── Firestore REST helpers ───────────────────────────────────────────
          function firestoreGetPage(projectId, accessToken, collection, pageToken) {
            return new Promise((resolve, reject) => {
              let path = '/v1/projects/' + projectId + '/databases/(default)/documents/' + collection + '?pageSize=300';
              if (pageToken) path += '&pageToken=' + encodeURIComponent(pageToken);
              https.get({
                hostname: 'firestore.googleapis.com',
                path,
                headers: { 'Authorization': 'Bearer ' + accessToken },
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(d)); }
                  catch(e) { reject(new Error('JSON parse error: ' + d.substring(0, 200))); }
                });
              }).on('error', reject);
            });
          }

          async function firestoreGetAll(projectId, accessToken, collection) {
            let docs      = [];
            let pageToken = null;
            do {
              const data = await firestoreGetPage(projectId, accessToken, collection, pageToken);
              if (data.error) {
                console.error(`  Error en colección '${collection}':`, JSON.stringify(data.error));
                return { documents: [], error: data.error };
              }
              docs      = docs.concat(data.documents || []);
              pageToken = data.nextPageToken || null;
            } while (pageToken);
            return { documents: docs };
          }

          function firestoreDelete(accessToken, docName) {
            return new Promise(resolve => {
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path:     '/v1/' + docName,
                method:   'DELETE',
                headers:  { 'Authorization': 'Bearer ' + accessToken },
              }, res => {
                res.resume();
                res.on('end', () => {
                  console.log('  Eliminado (status ' + res.statusCode + '): ' + docName.split('/').pop());
                  resolve();
                });
              });
              req.on('error', e => { console.warn('  Error eliminando suscripción:', e.message); resolve(); });
              req.end();
            });
          }

          // ── Envío Web Push nativo (Android/Chrome/Edge/iOS Safari PWA/Firefox) ──
          async function webPushSend(subscription, titulo, cuerpo, url, tag) {
            try {
              const payload = JSON.stringify({
                title: titulo,
                body:  cuerpo,
                url:   url,
                tag:   tag,
              });
              await webpush.sendNotification(subscription, payload, {
                TTL:     86400,
                urgency: 'high',
              });
              console.log('  WebPush ✓ OK: ' + subscription.endpoint.substring(0, 60) + '...');
              return { invalid: false, ok: true };
            } catch (err) {
              const invalid = err.statusCode === 404 || err.statusCode === 410;
              console.log('  WebPush ERROR ---');
              console.log('    statusCode :', err.statusCode);
              console.log('    endpoint   :', subscription.endpoint.substring(0, 80) + '...');
              console.log('    body       :', err.body || '(vacío)');
              console.log('    headers    :', JSON.stringify(err.headers || {}));
              console.log('    message    :', err.message || '(sin mensaje)');
              if (err.statusCode === 401 || err.statusCode === 403) {
                console.log('    ⚠️ 401/403: la suscripción se creó con OTRA clave VAPID o la clave');
                console.log('       privada/subject de los Secrets no coincide con la pública de index.html.');
              }
              console.log('  ---');
              return { invalid, ok: false };
            }
          }

          // ── Deduplicación entre los 3 disparos diarios (v26) ────────────────
          function firestoreRequest(accessToken, method, path, bodyObj) {
            return new Promise((resolve, reject) => {
              const body = bodyObj ? JSON.stringify(bodyObj) : null;
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path, method,
                headers: Object.assign(
                  { 'Authorization': 'Bearer ' + accessToken },
                  body ? { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } : {}
                ),
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({ status: res.statusCode, body: d }));
              });
              req.on('error', reject);
              if (body) req.write(body);
              req.end();
            });
          }
          async function yaEnviadoHoy(projectId, accessToken, fechaCompleta) {
            const r = await firestoreRequest(accessToken, 'GET',
              '/v1/projects/' + projectId + '/databases/(default)/documents/notificaciones_enviadas/' + fechaCompleta);
            return r.status === 200;
          }
          async function marcarEnviadoHoy(projectId, accessToken, fechaCompleta, enviados, total) {
            const r = await firestoreRequest(accessToken, 'POST',
              '/v1/projects/' + projectId + '/databases/(default)/documents/notificaciones_enviadas?documentId=' + fechaCompleta,
              { fields: {
                  enviadoEn: { stringValue: new Date().toISOString() },
                  enviados:  { integerValue: String(enviados) },
                  total:     { integerValue: String(total) },
              } });
            if (r.status !== 200 && r.status !== 409) console.warn('  No se pudo marcar envío (status ' + r.status + '): ' + r.body.substring(0, 200));
          }

          // ── MAIN ─────────────────────────────────────────────────────────────
          async function main() {
            const ahora     = new Date();

            // 'es-UY' en Ubuntu devuelve DD/MM/YYYY, por lo que parsear por
            // índice de partes daba fechaHoy = DD-MM en vez de MM-DD.
            // Solución robusta: convertir la hora a Uruguay y leer
            // getMonth/getDate directamente, sin depender del locale del
            // runner de GitHub Actions.
            const uyStr   = ahora.toLocaleString('en-US', { timeZone: 'America/Montevideo' });
            const uyDate  = new Date(uyStr);
            const mes     = String(uyDate.getMonth() + 1).padStart(2, '0');
            const dia     = String(uyDate.getDate()).padStart(2, '0');
            const fechaHoy = mes + '-' + dia;  // Formato MM-DD (igual que Firestore)
            const fechaCompleta = uyDate.getFullYear() + '-' + fechaHoy;  // AAAA-MM-DD (clave de dedupe)
            const projectId = process.env.FIREBASE_PROJECT_ID;
            const appUrl = 'https://caristim.github.io/oriente-fraterno/';

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('Oriente Fraterno 148 — Notificador de Eventos');
            console.log('Modo:             ', ES_MANUAL ? 'MANUAL (workflow_dispatch)' : 'automático (cron)');
            console.log('Hora UTC:         ', ahora.toISOString());
            console.log('Hora Uruguay:     ', uyDate.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }));
            console.log('Fecha Uruguay:    ', fechaHoy, '(formato MM-DD)');
            console.log('Firebase Project: ', projectId);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            let sa;
            try {
              sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            } catch (e) {
              console.error('❌ OF_FIREBASE_SERVICE_ACCOUNT no es un JSON válido:', e.message);
              process.exit(1);
            }

            const accessToken = await getGoogleToken(sa);
            console.log('Token Google OAuth2: ✓ OK');

            // ── [1/3] Leer eventos de Firestore ─────────────────────────────
            console.log('\n[1/3] Leyendo eventos de Firestore...');
            const eventosData = await firestoreGetAll(projectId, accessToken, 'eventos');
            if (eventosData.error) {
              console.error('❌ Error crítico leyendo eventos:', JSON.stringify(eventosData.error));
              process.exit(1);
            }

            const todosLosEventos = (eventosData.documents || []).map(doc => {
              const f = doc.fields || {};
              // Normalizar fecha a formato MM-DD sin importar si viene como
              // "MM-DD" o "YYYY-MM-DD" — ambos formatos existen en Firestore.
              const fechaRaw = (f.fecha && f.fecha.stringValue) || '';
              const parts    = fechaRaw.split('-');
              let fechaNorm  = '';
              if (parts.length === 2) {
                // Formato MM-DD
                fechaNorm = parts[0].padStart(2,'0') + '-' + parts[1].padStart(2,'0');
              } else if (parts.length === 3) {
                // Formato YYYY-MM-DD
                fechaNorm = parts[1].padStart(2,'0') + '-' + parts[2].padStart(2,'0');
              }
              return {
                nombre: (f.nombre && f.nombre.stringValue) || '',
                fecha:  fechaNorm,
                tipo:   (f.tipo   && f.tipo.stringValue)   || '',
              };
            }).filter(e => e.nombre && e.fecha && e.tipo);

            console.log('  Total eventos en Firestore:', todosLosEventos.length);

            const eventos = todosLosEventos.filter(e => e.fecha === fechaHoy);

            if (eventos.length === 0) {
              console.log(`\nHoy (${fechaHoy}) no hay eventos registrados. No se envían notificaciones.`);
              console.log('\nEventos próximos en los siguientes días:');
              const hoy   = new Date();
              const hoyUY = new Date(hoy.toLocaleString('en-US', { timeZone: 'America/Montevideo' }));
              for (let i = 1; i <= 7; i++) {
                const d   = new Date(hoyUY); d.setDate(d.getDate() + i);
                const dm  = String(d.getMonth() + 1).padStart(2,'0');
                const dd  = String(d.getDate()).padStart(2,'0');
                const fmt = dm + '-' + dd;
                const evs = todosLosEventos.filter(e => e.fecha === fmt);
                if (evs.length > 0) {
                  console.log(`  En ${i} día(s) (${fmt}): ` + evs.map(e => e.nombre).join(', '));
                }
              }
              console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              return;
            }

            console.log('  Eventos para hoy:', eventos.map(e => `${e.nombre} (${e.tipo})`).join(', '));

            if (!ES_MANUAL && await yaEnviadoHoy(projectId, accessToken, fechaCompleta)) {
              console.log('\n✔ Las notificaciones de hoy (' + fechaCompleta + ') ya fueron enviadas por un disparo anterior. Nada que hacer.');
              return;
            }

            // ── [2/3] Leer suscripciones WebPush (todas las plataformas) ─────
            console.log('\n[2/3] Leyendo suscripciones Web Push (Android/Windows/iOS/Firefox)...');
            const wpData = await firestoreGetAll(projectId, accessToken, 'webpush_subscriptions');
            const wpDocs = (wpData.error ? [] : (wpData.documents || [])).map(doc => {
              const f = doc.fields || {};
              return {
                endpoint: (f.endpoint && f.endpoint.stringValue) || '',
                p256dh:   (f.p256dh   && f.p256dh.stringValue)   || '',
                auth:     (f.auth     && f.auth.stringValue)     || '',
                platform: (f.platform && f.platform.stringValue) || 'unknown',
                docName:  doc.name,
              };
            }).filter(d => d.endpoint && d.p256dh && d.auth);
            console.log('  Suscripciones Web Push registradas:', wpDocs.length);

            if (wpDocs.length === 0) {
              console.log('\n⚠️  No hay dispositivos registrados.');
              console.log('   Solución: los usuarios deben abrir la app y pulsar "Activar Notificaciones".');
              console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              return;
            }

            // ── [3/3] Enviar notificaciones ──────────────────────────────────
            console.log('\n[3/3] Enviando notificaciones...');
            const wpInvalidos = new Set();
            let okCount = 0;

            for (const ev of eventos) {
              const titulo = 'Oriente Fraterno 148';
              const cuerpo = `Hoy: ${ev.tipo} de ${ev.nombre}`;
              const tag    = 'of-ev-' + ev.nombre
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-').toLowerCase().substring(0, 30) + '-' + fechaHoy;

              console.log(`\n  ✦ Evento: ${cuerpo}`);
              console.log(`  Tag: ${tag}`);
              console.log(`  Enviando Web Push a ${wpDocs.length} suscripción(es)...`);

              for (const sub of wpDocs) {
                const subscription = {
                  endpoint: sub.endpoint,
                  keys:     { p256dh: sub.p256dh, auth: sub.auth },
                };
                const r = await webPushSend(subscription, titulo, cuerpo, appUrl, tag);
                if (r.invalid) wpInvalidos.add(sub.docName);
                if (r.ok) okCount++;
              }
            }

            if (wpInvalidos.size > 0) {
              console.log(`\nLimpiando ${wpInvalidos.size} suscripción(es) inválida(s)...`);
              for (const dn of wpInvalidos) await firestoreDelete(accessToken, dn);
            }

            const wpEnviados = okCount;
            if (okCount > 0 && !ES_MANUAL) await marcarEnviadoHoy(projectId, accessToken, fechaCompleta, okCount, wpDocs.length * eventos.length);
            console.log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('✅ Proceso completado.');
            console.log(`   WebPush enviados: ${wpEnviados} / ${wpDocs.length}`);
            console.log(`   Suscripciones inválidas eliminadas: ${wpInvalidos.size}`);
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            // v26: si NO se entregó nada, el job falla (GitHub te manda un mail)
            // y el siguiente disparo de respaldo lo reintenta.
            if (okCount === 0) {
              console.error('❌ Ninguna notificación fue aceptada por los servidores push.');
              process.exit(1);
            }
          }

          main().catch(e => {
            console.error('\n❌ Error fatal:', e.message);
            console.error(e.stack);
            process.exit(1);
          });
          EOF
