name: Notificacion Eventos 9AM

on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 Uruguay (UTC-3, sin horario de verano)
  workflow_dispatch:         # Permite ejecutar manualmente para probar

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencia web-push
        run: npm install web-push

      - name: Verificar eventos y notificar (FCM + Web Push nativo)
        env:
          FIREBASE_PROJECT_ID:      ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
          # VAPID keys — generá las tuyas con: npx web-push generate-vapid-keys
          # La clave pública DEBE coincidir con VAPID_PUBLIC_KEY en index.html y sw.js
          VAPID_PUBLIC_KEY:  ${{ secrets.OF_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.OF_VAPID_PRIVATE_KEY }}
          # Email de contacto para el header VAPID (puede ser el tuyo)
          VAPID_SUBJECT:     ${{ secrets.OF_VAPID_SUBJECT }}
        run: |
          node << 'EOF'
          const https   = require('https');
          const crypto  = require('crypto');
          const webpush = require('web-push');

          // ── Configurar web-push con las VAPID keys ──────────────────────────
          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT || 'mailto:admin@example.com',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          // ── Helpers JWT para Google OAuth2 ────────────────────────────────
          function base64url(str) {
            return Buffer.from(str).toString('base64')
              .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
          }

          function getGoogleToken(sa) {
            return new Promise((resolve, reject) => {
              const now = Math.floor(Date.now() / 1000);
              const header  = { alg: 'RS256', typ: 'JWT' };
              const payload = {
                iss:   sa.client_email,
                scope: 'https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/datastore',
                aud:   'https://oauth2.googleapis.com/token',
                iat:   now,
                exp:   now + 3600
              };
              const data = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(payload));
              const sign = crypto.createSign('RSA-SHA256');
              sign.update(data);
              const jwt = data + '.' + sign.sign(sa.private_key, 'base64')
                .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
              const body = 'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=' + jwt;
              const req = https.request({
                hostname: 'oauth2.googleapis.com',
                path: '/token',
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  const p = JSON.parse(d);
                  p.access_token ? resolve(p.access_token) : reject(new Error('Token error: ' + d));
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // ── Firestore REST helpers ─────────────────────────────────────────
          function firestoreGetPage(projectId, accessToken, collection, pageToken) {
            return new Promise((resolve, reject) => {
              let path = '/v1/projects/' + projectId + '/databases/(default)/documents/' + collection + '?pageSize=300';
              if (pageToken) path += '&pageToken=' + encodeURIComponent(pageToken);
              https.get({
                hostname: 'firestore.googleapis.com',
                path,
                headers: { 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function firestoreGetAll(projectId, accessToken, collection) {
            let allDocuments = [];
            let pageToken = null;
            do {
              const data = await firestoreGetPage(projectId, accessToken, collection, pageToken);
              if (data.error) return data;
              allDocuments = allDocuments.concat(data.documents || []);
              pageToken = data.nextPageToken || null;
            } while (pageToken);
            return { documents: allDocuments };
          }

          function firestoreDelete(accessToken, docName) {
            return new Promise((resolve) => {
              const path = '/v1/' + docName;
              const req = https.request({
                hostname: 'firestore.googleapis.com',
                path,
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  console.log('Token inválido eliminado (status ' + res.statusCode + ')');
                  resolve();
                });
              });
              req.on('error', (e) => { console.warn('Error eliminando token: ' + e.message); resolve(); });
              req.end();
            });
          }

          // ── Envío FCM (Android / Chrome) ───────────────────────────────────
          function fcmSend(projectId, accessToken, token, titulo, cuerpo) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                message: {
                  token: token,
                  notification: {
                    title: titulo,
                    body:  cuerpo
                  },
                  webpush: {
                    headers: {
                      'Urgency': 'high',
                      'TTL': '86400'
                    },
                    notification: {
                      title: titulo,
                      body:  cuerpo,
                      icon:  'https://caristim.github.io/oriente-fraterno/icon-192.png',
                      badge: 'https://caristim.github.io/oriente-fraterno/icon-192.png',
                      requireInteraction: true,
                      vibrate: [200, 100, 200, 100, 200],
                      data: {
                        url:   'https://caristim.github.io/oriente-fraterno/',
                        title: titulo,
                        body:  cuerpo
                      }
                    },
                    fcm_options: { link: 'https://caristim.github.io/oriente-fraterno/' }
                  }
                }
              });
              const req = https.request({
                hostname: 'fcm.googleapis.com',
                path:     '/v1/projects/' + projectId + '/messages:send',
                method:   'POST',
                headers:  { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken }
              }, (res) => {
                let r = '';
                res.on('data', c => r += c);
                res.on('end', () => {
                  let parsed = {};
                  try { parsed = JSON.parse(r); } catch(_) {}
                  if (parsed.error) {
                    const details   = parsed.error.details || [];
                    const fcmError  = details.find(d => d.errorCode);
                    const errorCode = fcmError ? fcmError.errorCode : parsed.error.status;
                    const isInvalid = ['UNREGISTERED', 'INVALID_ARGUMENT'].includes(errorCode);
                    console.log('FCM error [' + errorCode + '] token: ' + token.substring(0, 20) + '...');
                    resolve({ invalid: isInvalid });
                  } else {
                    console.log('FCM OK: ' + token.substring(0, 20) + '...');
                    resolve({ invalid: false });
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // ── Envío Web Push nativo (iOS Safari y otros) ─────────────────────
          async function webPushSend(subscription, titulo, cuerpo) {
            try {
              const payload = JSON.stringify({
                title: titulo,
                body:  cuerpo,
                url:   'https://caristim.github.io/oriente-fraterno/'
              });
              await webpush.sendNotification(subscription, payload, {
                TTL: 86400,
                urgency: 'high'
              });
              console.log('WebPush OK: ' + subscription.endpoint.substring(0, 40) + '...');
              return { invalid: false };
            } catch (err) {
              // 404 / 410 = suscripción expirada o cancelada por el usuario
              const isInvalid = err.statusCode === 404 || err.statusCode === 410;
              console.log('WebPush error [' + err.statusCode + ']: ' + subscription.endpoint.substring(0, 40) + '...');
              return { invalid: isInvalid };
            }
          }

          // ── Main ──────────────────────────────────────────────────────────
          async function main() {
            const ahora     = new Date();
            // Uruguay es UTC-3 todo el año (sin DST desde 2015)
            const localTime = new Date(ahora.getTime() + (-3 * 60 * 60000));
            const dia       = String(localTime.getUTCDate()).padStart(2,'0');
            const mes       = String(localTime.getUTCMonth() + 1).padStart(2,'0');
            const fechaHoy  = mes + '-' + dia;   // formato MM-DD, igual al guardado en Firestore
            const projectId = process.env.FIREBASE_PROJECT_ID;

            console.log('Fecha Uruguay:', fechaHoy);

            const sa          = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const accessToken = await getGoogleToken(sa);
            console.log('Token Google OAuth2 OK');

            // ── Leer eventos de Firestore ──────────────────────────────────
            const eventosData = await firestoreGetAll(projectId, accessToken, 'eventos');
            if (eventosData.error) {
              console.error('Error leyendo eventos:', JSON.stringify(eventosData.error));
              process.exit(1);
            }
            const eventos = (eventosData.documents || []).map(doc => {
              const f = doc.fields || {};
              return {
                nombre: (f.nombre && f.nombre.stringValue) || '',
                fecha:  (f.fecha  && f.fecha.stringValue)  || '',
                tipo:   (f.tipo   && f.tipo.stringValue)   || ''
              };
            }).filter(e => e.fecha === fechaHoy);

            if (eventos.length === 0) {
              console.log('Hoy no hay eventos. Saliendo.');
              return;
            }
            console.log('Eventos hoy:', eventos.map(e => e.nombre).join(', '));

            // ── Leer tokens FCM (Android/Chrome) ──────────────────────────
            const fcmTokensData = await firestoreGetAll(projectId, accessToken, 'fcm_tokens');
            if (fcmTokensData.error) {
              console.error('Error leyendo fcm_tokens:', JSON.stringify(fcmTokensData.error));
              process.exit(1);
            }
            const fcmTokenDocs = (fcmTokensData.documents || []).map(doc => ({
              token:   (doc.fields && doc.fields.token && doc.fields.token.stringValue) || '',
              docName: doc.name
            })).filter(d => d.token.length > 0);
            console.log('Tokens FCM registrados:', fcmTokenDocs.length);

            // ── Leer suscripciones Web Push nativas (iOS/Safari) ──────────
            const wpSubsData = await firestoreGetAll(projectId, accessToken, 'webpush_subscriptions');
            if (wpSubsData.error) {
              // Si la colección no existe aún, no es un error fatal
              console.warn('Advertencia leyendo webpush_subscriptions:', JSON.stringify(wpSubsData.error));
            }
            const wpSubDocs = ((wpSubsData && wpSubsData.documents) || []).map(doc => {
              const f = doc.fields || {};
              return {
                endpoint: (f.endpoint && f.endpoint.stringValue) || '',
                p256dh:   (f.p256dh   && f.p256dh.stringValue)   || '',
                auth:     (f.auth     && f.auth.stringValue)     || '',
                platform: (f.platform && f.platform.stringValue) || 'unknown',
                docName:  doc.name
              };
            }).filter(d => d.endpoint && d.p256dh && d.auth);
            console.log('Suscripciones Web Push nativas registradas:', wpSubDocs.length);

            const fcmInvalidos  = new Set();
            const wpInvalidos   = new Set();

            // ── Enviar a cada evento ───────────────────────────────────────
            for (const ev of eventos) {
              const titulo = 'Oriente Fraterno 148';
              const msg    = 'Hoy: ' + ev.tipo + ' de ' + ev.nombre;
              console.log('Enviando:', msg);

              // Envío FCM
              for (const td of fcmTokenDocs) {
                const result = await fcmSend(projectId, accessToken, td.token, titulo, msg);
                if (result.invalid) fcmInvalidos.add(td.docName);
              }

              // Envío Web Push nativo
              for (const sub of wpSubDocs) {
                const subscription = {
                  endpoint: sub.endpoint,
                  keys: { p256dh: sub.p256dh, auth: sub.auth }
                };
                const result = await webPushSend(subscription, titulo, msg);
                if (result.invalid) wpInvalidos.add(sub.docName);
              }
            }

            // ── Limpiar tokens/suscripciones inválidos ─────────────────────
            if (fcmInvalidos.size > 0) {
              console.log('Limpiando', fcmInvalidos.size, 'token(s) FCM inválido(s)...');
              for (const docName of fcmInvalidos) {
                await firestoreDelete(accessToken, docName);
              }
            }

            if (wpInvalidos.size > 0) {
              console.log('Limpiando', wpInvalidos.size, 'suscripción(es) Web Push inválida(s)...');
              for (const docName of wpInvalidos) {
                await firestoreDelete(accessToken, docName);
              }
            }

            console.log('Proceso completado.');
            console.log('  FCM enviados:', fcmTokenDocs.length - fcmInvalidos.size, '/', fcmTokenDocs.length);
            console.log('  WebPush enviados:', wpSubDocs.length - wpInvalidos.size, '/', wpSubDocs.length);
          }

          main().catch(e => { console.error('Error fatal:', e.message); process.exit(1); });
          EOF
