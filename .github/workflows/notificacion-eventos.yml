name: Notificacion Eventos 9AM

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  enviar-notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencia web-push
        run: npm install web-push

      - name: Verificar eventos y notificar
        env:
          FIREBASE_PROJECT_ID:      ${{ secrets.OF_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OF_FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY:         ${{ secrets.OF_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:        ${{ secrets.OF_VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:            ${{ secrets.OF_VAPID_SUBJECT }}
        run: |
          node << 'EOF'

          const https   = require('https');
          const crypto  = require('crypto');
          const webpush = require('web-push');

          const APP_URL =
            'https://caristim.github.io/oriente-fraterno/index.html';

          // ==========================================================
          // VALIDACIÓN DE SECRETOS
          // ==========================================================

          const requiredEnv = [
            'FIREBASE_PROJECT_ID',
            'FIREBASE_SERVICE_ACCOUNT',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY'
          ];

          const missing = requiredEnv.filter(
            k => !process.env[k]
          );

          if (missing.length) {
            console.error('❌ Secretos faltantes:');
            missing.forEach(v =>
              console.error('   OF_' + v)
            );
            process.exit(1);
          }

          // ==========================================================
          // CONFIGURACIÓN VAPID
          // ==========================================================

          webpush.setVapidDetails(
            process.env.VAPID_SUBJECT || 'mailto:admin@example.com',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          // ==========================================================
          // JWT GOOGLE
          // ==========================================================

          function base64url(str) {
            return Buffer.from(str)
              .toString('base64')
              .replace(/\+/g,'-')
              .replace(/\//g,'_')
              .replace(/=/g,'');
          }

          function getGoogleToken(sa) {

            return new Promise((resolve,reject)=>{

              const now = Math.floor(Date.now()/1000);

              const header = {
                alg:'RS256',
                typ:'JWT'
              };

              const payload = {
                iss: sa.client_email,
                scope:
                  'https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/datastore',
                aud:
                  'https://oauth2.googleapis.com/token',
                iat: now,
                exp: now + 3600
              };

              const jwtData =
                base64url(JSON.stringify(header))
                + '.'
                + base64url(JSON.stringify(payload));

              const sign =
                crypto.createSign('RSA-SHA256');

              sign.update(jwtData);

              const jwt =
                jwtData + '.'
                + sign.sign(
                    sa.private_key,
                    'base64'
                  )
                  .replace(/\+/g,'-')
                  .replace(/\//g,'_')
                  .replace(/=/g,'');

              const body =
                'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion='
                + jwt;

              const req = https.request({
                hostname:'oauth2.googleapis.com',
                path:'/token',
                method:'POST',
                headers:{
                  'Content-Type':
                  'application/x-www-form-urlencoded'
                }
              },res=>{

                let data='';

                res.on('data',c=>data+=c);

                res.on('end',()=>{

                  try{
                    const json =
                      JSON.parse(data);

                    if(json.access_token){
                      resolve(json.access_token);
                    }else{
                      reject(
                        new Error(data)
                      );
                    }

                  }catch(e){
                    reject(e);
                  }

                });

              });

              req.on('error',reject);
              req.write(body);
              req.end();

            });

          }

          // ==========================================================
          // FIRESTORE
          // ==========================================================

          function firestoreGetPage(
            projectId,
            accessToken,
            collection,
            pageToken
          ){

            return new Promise((resolve,reject)=>{

              let path =
                `/v1/projects/${projectId}/databases/(default)/documents/${collection}?pageSize=300`;

              if(pageToken){
                path +=
                  '&pageToken='
                  + encodeURIComponent(pageToken);
              }

              https.get({
                hostname:'firestore.googleapis.com',
                path,
                headers:{
                  Authorization:
                    'Bearer '+accessToken
                }
              },res=>{

                let data='';

                res.on('data',
                  c=>data+=c
                );

                res.on('end',()=>{

                  try{
                    resolve(
                      JSON.parse(data)
                    );
                  }catch(e){
                    reject(e);
                  }

                });

              }).on('error',reject);

            });

          }

          async function firestoreGetAll(
            projectId,
            accessToken,
            collection
          ){

            let docs=[];
            let pageToken=null;

            do{

              const page =
                await firestoreGetPage(
                  projectId,
                  accessToken,
                  collection,
                  pageToken
                );

              if(page.error){
                return page;
              }

              docs =
                docs.concat(
                  page.documents || []
                );

              pageToken =
                page.nextPageToken || null;

            }while(pageToken);

            return {documents:docs};

          }

          function firestoreDelete(
            accessToken,
            docName
          ){

            return new Promise(resolve=>{

              const req = https.request({

                hostname:
                  'firestore.googleapis.com',

                path:'/v1/' + docName,

                method:'DELETE',

                headers:{
                  Authorization:
                    'Bearer ' + accessToken
                }

              },res=>{

                res.resume();

                res.on('end',resolve);

              });

              req.on('error',resolve);
              req.end();

            });

          }

          // ==========================================================
          // FCM
          // ==========================================================

          async function fcmSend(
            projectId,
            accessToken,
            token,
            title,
            body,
            tag
          ){

            return new Promise(resolve=>{

              const payload = {

                message:{

                  token,

                  notification:{
                    title,
                    body
                  },

                  data:{
                    title,
                    body,
                    tag,
                    url:APP_URL
                  },

                  android:{
                    priority:'high',
                    ttl:'86400s',
                    notification:{
                      channel_id:'default',
                      sound:'default'
                    }
                  },

                  webpush:{
                    headers:{
                      TTL:'86400',
                      Urgency:'high'
                    }
                  }

                }

              };

              const req = https.request({

                hostname:'fcm.googleapis.com',

                path:
                  `/v1/projects/${projectId}/messages:send`,

                method:'POST',

                headers:{
                  'Content-Type':
                    'application/json',
                  Authorization:
                    'Bearer '+accessToken
                }

              },res=>{

                let data='';

                res.on('data',
                  c=>data+=c
                );

                res.on('end',()=>{

                  try{

                    const json =
                      JSON.parse(data);

                    if(json.error){

                      const details =
                        json.error.details || [];

                      const err =
                        details.find(
                          d=>d.errorCode
                        );

                      const code =
                        err
                          ? err.errorCode
                          : json.error.status;

                      console.log(
                        'FCM ERROR:',
                        code
                      );

                      resolve({
                        invalid:
                          code==='UNREGISTERED'
                          || code==='INVALID_ARGUMENT'
                      });

                    }else{

                      console.log(
                        'FCM OK'
                      );

                      resolve({
                        invalid:false
                      });

                    }

                  }catch{

                    resolve({
                      invalid:false
                    });

                  }

                });

              });

              req.on('error',()=>resolve({
                invalid:false
              }));

              req.write(
                JSON.stringify(payload)
              );

              req.end();

            });

          }

          // ==========================================================
          // WEB PUSH
          // ==========================================================

          async function webPushSend(
            subscription,
            title,
            body,
            tag
          ){

            try{

              await webpush.sendNotification(
                subscription,
                JSON.stringify({
                  title,
                  body,
                  tag,
                  url:APP_URL
                }),
                {
                  TTL:86400,
                  urgency:'high'
                }
              );

              console.log('WEB PUSH OK');

              return {
                invalid:false
              };

            }catch(err){

              return {
                invalid:
                  err.statusCode===404
                  || err.statusCode===410
              };

            }

          }

          // ==========================================================
          // MAIN
          // ==========================================================

          async function main(){

            const now =
              new Date();

            const uy =
              new Date(
                now.getTime()
                - (3*60*60*1000)
              );

            const fechaHoy =
              String(
                uy.getUTCMonth()+1
              ).padStart(2,'0')
              + '-'
              + String(
                uy.getUTCDate()
              ).padStart(2,'0');

            console.log(
              'Fecha Uruguay:',
              fechaHoy
            );

            const sa =
              JSON.parse(
                process.env
                .FIREBASE_SERVICE_ACCOUNT
              );

            const accessToken =
              await getGoogleToken(sa);

            const projectId =
              process.env
              .FIREBASE_PROJECT_ID;

            const eventosData =
              await firestoreGetAll(
                projectId,
                accessToken,
                'eventos'
              );

            const eventos =
              (eventosData.documents||[])
              .map(doc=>{

                const f =
                  doc.fields || {};

                return{
                  nombre:
                    f.nombre?.stringValue || '',
                  fecha:
                    f.fecha?.stringValue || '',
                  tipo:
                    f.tipo?.stringValue || ''
                };

              })
              .filter(
                e=>e.fecha===fechaHoy
              );

            if(!eventos.length){
              console.log(
                'No hay eventos hoy.'
              );
              return;
            }

            const fcmData =
              await firestoreGetAll(
                projectId,
                accessToken,
                'fcm_tokens'
              );

            const wpData =
              await firestoreGetAll(
                projectId,
                accessToken,
                'webpush_subscriptions'
              );

            const fcmDocs =
              (fcmData.documents||[]);

            const wpDocs =
              (wpData.documents||[]);

            const invalidFCM =
              new Set();

            const invalidWP =
              new Set();

            for(const ev of eventos){

              const title =
                'Oriente Fraterno 148';

              const body =
                `Hoy: ${ev.tipo} de ${ev.nombre}`;

              const tag =
                'evento-' +
                fechaHoy;

              for(const doc of fcmDocs){

                const token =
                  doc.fields?.token?.stringValue;

                if(!token) continue;

                const r =
                  await fcmSend(
                    projectId,
                    accessToken,
                    token,
                    title,
                    body,
                    tag
                  );

                if(r.invalid){
                  invalidFCM.add(
                    doc.name
                  );
                }

              }

              for(const doc of wpDocs){

                const f =
                  doc.fields || {};

                const sub = {

                  endpoint:
                    f.endpoint?.stringValue,

                  keys:{
                    p256dh:
                      f.p256dh?.stringValue,
                    auth:
                      f.auth?.stringValue
                  }

                };

                const r =
                  await webPushSend(
                    sub,
                    title,
                    body,
                    tag
                  );

                if(r.invalid){
                  invalidWP.add(
                    doc.name
                  );
                }

              }

            }

            for(const d of invalidFCM){
              await firestoreDelete(
                accessToken,
                d
              );
            }

            for(const d of invalidWP){
              await firestoreDelete(
                accessToken,
                d
              );
            }

            console.log(
              'Proceso completado.'
            );

          }

          main().catch(err=>{
            console.error(err);
            process.exit(1);
          });

          EOF
